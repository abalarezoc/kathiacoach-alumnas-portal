<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — Kathia Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <span class="wordmark">Kathia Coach<span>Especialista en musculación · Mujeres 40+</span></span>
    <h2>Recuperar contraseña</h2>
    <form id="reset-form">
      <label for="email">Tu correo</label>
      <input type="email" id="email" required autocomplete="email">
      <button type="submit" class="btn-primary" id="submit-btn">Enviar link de recuperación</button>
    </form>
    <div id="msg" class="error-msg" style="display:none;"></div>
    <p class="help-note"><a href="index.html">Volver a iniciar sesión</a></p>
  </div>
</div>

<script>
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('reset-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    const redirectTo = window.location.origin + '/nueva-password.html';
    const { error } = await supa.auth.resetPasswordForEmail(email, { redirectTo });

    msg.style.display = 'block';
    if (error) {
      msg.textContent = 'Hubo un problema: ' + error.message;
    } else {
      msg.style.color = '#33302B';
      msg.textContent = 'Listo. Si ese correo tiene una cuenta, te llegará un link para crear una nueva contraseña (revisa también spam).';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar link de recuperación';
  });
</script>

</body>
</html>
