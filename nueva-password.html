<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — Kathia Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <span class="wordmark">Kathia Coach<span>Especialista en musculación · Mujeres 40+</span></span>
    <h2>Crea tu nueva contraseña</h2>
    <form id="new-pass-form">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <label for="password2">Repítela</label>
      <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn-primary" id="submit-btn">Guardar contraseña</button>
    </form>
    <div id="msg" class="error-msg" style="display:none;"></div>
  </div>
</div>

<script>
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('new-pass-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    msg.style.display = 'none';
    if (password !== password2) {
      msg.textContent = 'Las contraseñas no coinciden.';
      msg.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';

    const { error } = await supa.auth.updateUser({ password });

    if (error) {
      msg.textContent = 'El link expiró o no es válido. Pide uno nuevo desde "Olvidé mi contraseña".';
      msg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Guardar contraseña';
    } else {
      window.location.href = 'portal.html';
    }
  });
</script>

</body>
</html>
