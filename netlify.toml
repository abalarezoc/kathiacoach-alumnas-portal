# Configuración de Netlify para el Portal de Alumnas.
#
# publish "." significa que todo lo que está en esta carpeta (los
# .html, styles.css, etc.) se publica tal cual, igual que cuando se
# arrastraba el zip. La diferencia es que ahora Netlify también
# reconoce la carpeta netlify/functions/ y publica la función que
# consulta Cal.com.

[build]
  publish = "."
  functions = "netlify/functions"

# Corre sola todos los días para que a ninguna alumna con horario fijo
# se le acabe el calendario sin avisar (le va agregando semanas nuevas
# antes de que le queden menos de 4 clases por delante).
[functions."renovar-horarios-fijos"]
  schedule = "@daily"
