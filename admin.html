<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Kathia — Progreso de Alumnas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<nav class="top">
  <div class="wrap-wide">
    <span class="wordmark" onclick="renderGrid()" style="cursor:pointer;">Kathia Coach<span>Panel de Progreso</span></span>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="logout-btn" onclick="renderGrid()">📊 Alumnas</button>
      <button class="logout-btn" onclick="renderAgendaCalendario()">📅 Agenda</button>
      <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </div>
</nav>

<main class="portal">
  <div class="wrap-wide" id="content">
    <div class="loading">Cargando...</div>
  </div>
</main>

<script>
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const contentEl = document.getElementById('content');
  let alumnasCache = [];
  let currentProgreso = [];
  let editingId = null;
  let animoSeleccionado = null;
  let vistaActual = 'grid'; // 'grid' | 'detalle' | 'agenda-calendario'
  const ICONOS_ANIMO = ['💪', '🔥', '👏', '🌟', '❤️', '🎉'];

  function fmtFecha(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function diasDesde(iso) {
    const d = new Date(iso + 'T00:00:00');
    return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
  }

  const NOMBRES_DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  function nombreDia(n) { return NOMBRES_DIA[n] || '—'; }
  function fmtHora12(horaStr) {
    if (!horaStr) return '—';
    const [hh, mm] = horaStr.split(':').map(Number);
    const ampm = hh < 12 ? 'a.m.' : 'p.m.';
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
  }

  async function init() {
    const { data: { session } } = await supa.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    const { data: miPerfil } = await supa.from('alumnas').select('es_admin').eq('id', session.user.id).single();
    if (!miPerfil || !miPerfil.es_admin) {
      window.location.href = 'portal.html';
      return;
    }

    await cargarAlumnas();
    renderGrid();
  }

  async function cargarAlumnas() {
    const { data: alumnas, error } = await supa
      .from('alumnas')
      .select('id, nombre, email, activa, peso_objetivo, fecha_nacimiento, estatura_cm, direccion, recibir_invites_calendario')
      .order('nombre', { ascending: true });

    if (error) {
      contentEl.innerHTML = `<div class="empty-state">No se pudo cargar la lista de alumnas.</div>`;
      return;
    }

    const { data: progresoTodo } = await supa
      .from('progreso')
      .select('alumna_id, fecha, peso_kg, cintura_cm, cadera_cm')
      .order('fecha', { ascending: false });

    // Resumen por alumna: cantidad de registros, último registro, últimas medidas y últimos 2 pesos (para el semáforo)
    const resumen = {};
    (progresoTodo || []).forEach(p => {
      if (!resumen[p.alumna_id]) {
        resumen[p.alumna_id] = { total: 0, ultima: null, ultimoPeso: null, ultimaCintura: null, ultimaCadera: null, pesos: [] };
      }
      const r = resumen[p.alumna_id];
      r.total++;
      if (!r.ultima) r.ultima = p.fecha;
      if (r.ultimoPeso == null && p.peso_kg != null) r.ultimoPeso = p.peso_kg;
      if (r.ultimaCintura == null && p.cintura_cm != null) r.ultimaCintura = p.cintura_cm;
      if (r.ultimaCadera == null && p.cadera_cm != null) r.ultimaCadera = p.cadera_cm;
      if (p.peso_kg != null && r.pesos.length < 2) r.pesos.push(p.peso_kg);
    });

    alumnasCache = alumnas.map(a => ({
      ...a,
      total: resumen[a.id] ? resumen[a.id].total : 0,
      ultima: resumen[a.id] ? resumen[a.id].ultima : null,
      ultimoPeso: resumen[a.id] ? resumen[a.id].ultimoPeso : null,
      ultimaCintura: resumen[a.id] ? resumen[a.id].ultimaCintura : null,
      ultimaCadera: resumen[a.id] ? resumen[a.id].ultimaCadera : null,
      pesos: resumen[a.id] ? resumen[a.id].pesos : [],
    }));
  }

  function badgeFor(a) {
    if (!a.ultima) return { cls: 'nueva', icon: '✨', texto: 'Nueva, sin registros' };
    const dias = diasDesde(a.ultima);
    if (dias <= 14) return { cls: 'al-dia', icon: '✓', texto: 'Al día' };
    return { cls: 'pendiente', icon: '⏱', texto: `Sin registrar hace ${dias} días` };
  }

  function semaforoFor(a) {
    if (a.peso_objetivo == null || a.pesos.length < 2) {
      return { cls: 'sf-gris', icon: '⚪', texto: 'Sin datos suficientes' };
    }
    const [ultimo, previo] = a.pesos; // [0]=más reciente, [1]=anterior
    const distPrevia = Math.abs(previo - a.peso_objetivo);
    const distActual = Math.abs(ultimo - a.peso_objetivo);
    const avance = distPrevia - distActual;
    if (avance > 0.3) return { cls: 'sf-verde', icon: '🟢', texto: 'En progreso' };
    if (avance < -0.3) return { cls: 'sf-rojo', icon: '🔴', texto: 'Retrocedió' };
    return { cls: 'sf-amarillo', icon: '🟡', texto: 'Estancada' };
  }

  function calcularEdad(fechaNac) {
    const hoy = new Date();
    const nac = new Date(fechaNac + 'T00:00:00');
    let edad = hoy.getFullYear() - nac.getFullYear();
    const m = hoy.getMonth() - nac.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
    return edad;
  }

  function diasParaCumple(fechaNac) {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const nac = new Date(fechaNac + 'T00:00:00');
    let prox = new Date(hoy.getFullYear(), nac.getMonth(), nac.getDate());
    if (prox < hoy) prox = new Date(hoy.getFullYear() + 1, nac.getMonth(), nac.getDate());
    return Math.round((prox - hoy) / (1000 * 60 * 60 * 24));
  }

  // IMC (índice de masa corporal): peso_kg / estatura_m². Categorías de referencia OMS —
  // informativo, no reemplaza una evaluación clínica.
  function imcFor(pesoKg, estaturaCm) {
    if (pesoKg == null || !estaturaCm) return null;
    const m = estaturaCm / 100;
    const imc = pesoKg / (m * m);
    let categoria;
    if (imc < 18.5) categoria = 'Bajo peso';
    else if (imc < 25) categoria = 'Normal';
    else if (imc < 30) categoria = 'Sobrepeso';
    else categoria = 'Obesidad';
    return { valor: imc.toFixed(1), categoria };
  }

  // ICC (índice cintura-cadera): se calcula solo con datos que ya se registran (sin pedirle nada nuevo a Kathia).
  function iccFor(cinturaCm, caderaCm) {
    if (cinturaCm == null || caderaCm == null) return null;
    return (cinturaCm / caderaCm).toFixed(2);
  }

  function renderGrid() {
    vistaActual = 'grid';
    const cards = alumnasCache.map((a, i) => {
      const b = badgeFor(a);
      const s = semaforoFor(a);

      const medidas = [];
      if (a.ultimoPeso != null) medidas.push(`⚖️ ${a.ultimoPeso}kg`);
      if (a.ultimaCintura != null) medidas.push(`Cint. ${a.ultimaCintura}cm`);
      if (a.ultimaCadera != null) medidas.push(`Cad. ${a.ultimaCadera}cm`);

      const imc = imcFor(a.ultimoPeso, a.estatura_cm);
      const icc = iccFor(a.ultimaCintura, a.ultimaCadera);
      const indices = [];
      if (imc) indices.push(`IMC ${imc.valor} (${imc.categoria})`);
      if (icc) indices.push(`ICC ${icc}`);

      let edadHTML = '';
      if (a.fecha_nacimiento) {
        const edad = calcularEdad(a.fecha_nacimiento);
        const dias = diasParaCumple(a.fecha_nacimiento);
        const cumpleTexto = dias === 0 ? '🎂 ¡Hoy!' : dias <= 14 ? `🎂 en ${dias} días` : '';
        edadHTML = `<div class="card-meta">${edad} años ${cumpleTexto}</div>`;
      }

      return `
        <div class="alumna-card" style="animation-delay:${i * 40}ms" onclick="abrirAlumna('${a.id}')">
          <div class="nombre">${a.nombre || a.email}</div>
          <div class="email">${a.email || ''}</div>
          <div class="badge-row">
            <span class="badge ${b.cls}">${b.icon} ${b.texto}</span>
            <span class="badge ${s.cls}">${s.icon} ${s.texto}</span>
          </div>
          ${medidas.length ? `<div class="card-meta card-medidas">${medidas.join(' · ')}</div>` : ''}
          ${indices.length ? `<div class="card-meta card-medidas">${indices.join(' · ')}</div>` : ''}
          ${edadHTML}
          <div class="card-meta">${a.total} registro${a.total === 1 ? '' : 's'} ${a.ultima ? '· último: ' + fmtFecha(a.ultima) : ''}</div>
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <h1 class="greeting">Progreso de alumnas</h1>
      <p class="greeting-sub">${alumnasCache.length} alumna${alumnasCache.length === 1 ? '' : 's'} registrada${alumnasCache.length === 1 ? '' : 's'}. Haz clic en una para ver o agregar su progreso.</p>
      <div class="alumnas-grid">${cards || '<div class="empty-state">Todavía no hay alumnas registradas.</div>'}</div>
    `;
  }

  async function fotoUrl(path) {
    if (!path) return null;
    const { data, error } = await supa.storage.from('progreso-fotos').createSignedUrl(path, 3600);
    return (!error && data) ? data.signedUrl : null;
  }

  window.abrirAlumna = async function(id) {
    vistaActual = 'detalle';
    const a = alumnasCache.find(x => x.id === id);
    contentEl.innerHTML = `<div class="loading">Cargando...</div>`;

    const { data: progreso } = await supa
      .from('progreso')
      .select('id, fecha, peso_kg, cintura_cm, cadera_cm, medidas, notas, foto_path, animo')
      .eq('alumna_id', id)
      .order('fecha', { ascending: false });

    currentProgreso = progreso || [];
    editingId = null;
    animoSeleccionado = null;

    const filas = (progreso || []).map(p => `
      <tr>
        <td>${fmtFecha(p.fecha)}</td>
        <td>${p.peso_kg != null ? p.peso_kg + ' kg' : '—'}</td>
        <td>${p.cintura_cm != null ? p.cintura_cm + ' cm' : '—'}</td>
        <td>${p.cadera_cm != null ? p.cadera_cm + ' cm' : '—'}</td>
        <td>${p.notas || p.medidas || '—'}</td>
        <td style="font-size:17px;">${p.animo || '—'}</td>
        <td>${p.foto_path ? `<span class="foto-thumb" data-path="${p.foto_path}">Ver foto</span>` : '—'}</td>
        <td class="row-actions">
          <button class="edit-btn" onclick="editarRegistro(${p.id})">Editar</button>
          <button class="del-btn" onclick="borrarRegistro(${p.id}, '${id}')">Borrar</button>
        </td>
      </tr>
    `).join('');

    contentEl.innerHTML = `
      <div class="detail-header">
        <div>
          <h1 class="greeting">${a.nombre || a.email}</h1>
          <p class="greeting-sub" style="margin-bottom:0;">${a.email}</p>
        </div>
        <span class="back-link" onclick="renderGrid()">← Volver a todas</span>
      </div>

      ${(() => {
        const ultimoPeso = (progreso || []).find(p => p.peso_kg != null);
        const metaAlcanzada = a.peso_objetivo != null && ultimoPeso && Math.abs(ultimoPeso.peso_kg - a.peso_objetivo) < 0.5;
        return `
      <div class="entry-form" style="margin-bottom:20px;">
        <h3 style="margin-bottom:4px;">Datos de la alumna</h3>
        ${metaAlcanzada ? `<div class="meta-box" style="margin:8px 0 16px;">🎉 Alcanzó su meta de <strong>${a.peso_objetivo} kg</strong>. Fija una nueva meta abajo cuando quieras.</div>` : ''}
        <form id="meta-form" class="grid2" style="align-items:end;">
          <div>
            <label>Peso objetivo (kg)</label>
            <input type="number" step="0.1" id="f-meta" placeholder="${metaAlcanzada ? 'Nueva meta' : 'Ej. 65'}" value="${metaAlcanzada ? '' : (a.peso_objetivo != null ? a.peso_objetivo : '')}">
          </div>
          <div>
            <label>Fecha de nacimiento</label>
            <input type="date" id="f-nacimiento" value="${a.fecha_nacimiento || ''}">
          </div>
          <div>
            <label>Estatura (cm)</label>
            <input type="number" step="0.1" id="f-estatura" placeholder="Ej. 162" value="${a.estatura_cm != null ? a.estatura_cm : ''}">
          </div>
          <div>
            <label>Dirección</label>
            <input type="text" id="f-direccion" placeholder="Opcional" value="${a.direccion || ''}">
          </div>
          <div style="grid-column:1/-1;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" id="f-recibir-invites" style="width:auto;"${a.recibir_invites_calendario ? ' checked' : ''}>
              Quiere recibir también el correo automático de Google Calendar por cada sesión
            </label>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:12px; grid-column:1/-1;">Guardar datos</button>
        </form>
      </div>`;
      })()}

      <div class="entry-form">
        <h3 id="entry-form-title" style="margin-bottom:4px;">Agregar registro</h3>
        <form id="entry-form">
          <div class="grid2">
            <div>
              <label>Fecha</label>
              <input type="date" id="f-fecha" value="${new Date().toISOString().slice(0,10)}" required>
            </div>
            <div>
              <label>Peso (kg)</label>
              <input type="number" step="0.1" id="f-peso" placeholder="Opcional">
            </div>
          </div>
          <div class="grid2">
            <div>
              <label>Cintura (cm)</label>
              <input type="number" step="0.1" id="f-cintura" placeholder="Opcional">
            </div>
            <div>
              <label>Cadera (cm)</label>
              <input type="number" step="0.1" id="f-cadera" placeholder="Opcional">
            </div>
          </div>
          <label>Notas</label>
          <textarea id="f-notas" placeholder="Cómo estuvo la sesión, ajustes, observaciones..."></textarea>
          <label>Ícono de ánimo (opcional)</label>
          <div class="animo-picker" id="animo-picker">
            ${ICONOS_ANIMO.map(icono => `<button type="button" class="animo-btn" data-icono="${icono}">${icono}</button>`).join('')}
          </div>
          <label id="f-foto-label">Foto de progreso (opcional)</label>
          <input type="file" id="f-foto" accept="image/*">
          <div style="display:flex; gap:10px; align-items:center;">
            <button type="submit" class="btn-primary" id="entry-submit-btn">Guardar registro</button>
            <span class="back-link" id="cancel-edit" style="display:none;">Cancelar edición</span>
          </div>
        </form>
      </div>

      <section class="block">
        <h3>Historial</h3>
        ${progreso && progreso.length ? `
          <table class="progreso">
            <thead><tr><th>Fecha</th><th>Peso</th><th>Cintura</th><th>Cadera</th><th>Notas</th><th>Ánimo</th><th>Foto</th><th></th></tr></thead>
            <tbody>${filas}</tbody>
          </table>
        ` : `<div class="empty-state">Todavía no hay registros para ella.</div>`}
      </section>
    `;

    document.getElementById('meta-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = document.getElementById('f-meta').value;
      const nacimiento = document.getElementById('f-nacimiento').value;
      const estatura = document.getElementById('f-estatura').value;
      const direccion = document.getElementById('f-direccion').value.trim();
      const recibirInvites = document.getElementById('f-recibir-invites').checked;
      const { error } = await supa.from('alumnas').update({
        peso_objetivo: val ? parseFloat(val) : null,
        fecha_nacimiento: nacimiento || null,
        estatura_cm: estatura ? parseFloat(estatura) : null,
        direccion: direccion || null,
        recibir_invites_calendario: recibirInvites,
      }).eq('id', id);
      if (error) { alert('No se pudo guardar: ' + error.message); return; }
      a.peso_objetivo = val ? parseFloat(val) : null;
      a.fecha_nacimiento = nacimiento || null;
      a.estatura_cm = estatura ? parseFloat(estatura) : null;
      a.direccion = direccion || null;
      a.recibir_invites_calendario = recibirInvites;
      alert('Datos guardados.');
    });

    document.querySelectorAll('.animo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const yaActivo = btn.classList.contains('active');
        document.querySelectorAll('.animo-btn').forEach(b => b.classList.remove('active'));
        if (yaActivo) {
          animoSeleccionado = null;
        } else {
          btn.classList.add('active');
          animoSeleccionado = btn.dataset.icono;
        }
      });
    });

    document.querySelectorAll('.foto-thumb').forEach(el => {
      el.addEventListener('click', async () => {
        el.textContent = 'Cargando...';
        const url = await fotoUrl(el.dataset.path);
        if (url) window.open(url, '_blank');
        el.textContent = 'Ver foto';
      });
    });

    window.editarRegistro = function(regId) {
      const p = currentProgreso.find(x => x.id === regId);
      if (!p) return;
      editingId = regId;

      document.getElementById('f-fecha').value = p.fecha;
      document.getElementById('f-peso').value = p.peso_kg != null ? p.peso_kg : '';
      document.getElementById('f-cintura').value = p.cintura_cm != null ? p.cintura_cm : '';
      document.getElementById('f-cadera').value = p.cadera_cm != null ? p.cadera_cm : '';
      document.getElementById('f-notas').value = p.notas || p.medidas || '';
      document.getElementById('f-foto').value = '';

      animoSeleccionado = p.animo || null;
      document.querySelectorAll('.animo-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.icono === animoSeleccionado);
      });

      document.getElementById('entry-form-title').textContent = 'Editar registro del ' + fmtFecha(p.fecha);
      document.getElementById('f-foto-label').textContent = p.foto_path
        ? 'Reemplazar foto (opcional — deja vacío para conservar la actual)'
        : 'Foto de progreso (opcional)';
      document.getElementById('entry-submit-btn').textContent = 'Actualizar registro';
      document.getElementById('cancel-edit').style.display = 'inline';

      document.getElementById('entry-form').closest('.entry-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    function salirModoEdicion() {
      editingId = null;
      animoSeleccionado = null;
      document.querySelectorAll('.animo-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('entry-form').reset();
      document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);
      document.getElementById('entry-form-title').textContent = 'Agregar registro';
      document.getElementById('f-foto-label').textContent = 'Foto de progreso (opcional)';
      document.getElementById('entry-submit-btn').textContent = 'Guardar registro';
      document.getElementById('cancel-edit').style.display = 'none';
    }

    document.getElementById('cancel-edit').addEventListener('click', salirModoEdicion);

    document.getElementById('entry-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('entry-submit-btn');
      const editando = editingId !== null;
      submitBtn.disabled = true;
      submitBtn.textContent = editando ? 'Actualizando...' : 'Guardando...';

      const fecha = document.getElementById('f-fecha').value;
      const peso = document.getElementById('f-peso').value;
      const cintura = document.getElementById('f-cintura').value;
      const cadera = document.getElementById('f-cadera').value;
      const notas = document.getElementById('f-notas').value.trim();
      const fotoFile = document.getElementById('f-foto').files[0];

      let foto_path = editando ? (currentProgreso.find(x => x.id === editingId) || {}).foto_path || null : null;
      if (fotoFile) {
        const ext = fotoFile.name.split('.').pop();
        const path = `${id}/${fecha}-${Date.now()}.${ext}`;
        const { error: upErr } = await supa.storage.from('progreso-fotos').upload(path, fotoFile);
        if (upErr) {
          alert('No se pudo subir la foto: ' + upErr.message);
          submitBtn.disabled = false;
          submitBtn.textContent = editando ? 'Actualizar registro' : 'Guardar registro';
          return;
        }
        foto_path = path;
      }

      const payload = {
        fecha,
        peso_kg: peso ? parseFloat(peso) : null,
        cintura_cm: cintura ? parseFloat(cintura) : null,
        cadera_cm: cadera ? parseFloat(cadera) : null,
        notas: notas || null,
        foto_path,
        animo: animoSeleccionado,
      };

      const { error } = editando
        ? await supa.from('progreso').update(payload).eq('id', editingId)
        : await supa.from('progreso').insert({ alumna_id: id, ...payload });

      if (error) {
        alert('No se pudo guardar: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = editando ? 'Actualizar registro' : 'Guardar registro';
      } else {
        abrirAlumna(id);
      }
    });
  };

  window.borrarRegistro = async function(regId, alumnaId) {
    if (!confirm('¿Borrar este registro?')) return;
    const { error } = await supa.from('progreso').delete().eq('id', regId);
    if (error) { alert('No se pudo borrar: ' + error.message); return; }
    abrirAlumna(alumnaId);
  };

  // ============================================================
  // Agenda: calendario de mes con todas las sesiones de todas las
  // alumnas (horario_fijo + citas_fijas vía Google Calendar) — para que
  // Kathia vea y gestione su agenda sin salir del panel.
  // ============================================================

  function construirCalendarioAgenda(area, citasPorDia) {
    const dias = Object.keys(citasPorDia).sort();
    const hoyLima = new Date(Date.now() - 5 * 3600000);
    const hoyStr = hoyLima.toISOString().slice(0, 10);
    let mesActual = new Date(hoyLima.getFullYear(), hoyLima.getMonth(), 1);
    let diaSeleccionado = dias.length ? dias[0] : hoyStr;
    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const primerDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const ultimoDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
      const offset = primerDiaMes.getDay();
      const filas = Math.ceil((offset + ultimoDiaMes.getDate()) / 7);
      const nombreMes = mesActual.toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });

      let celdas = '';
      for (let i = 0; i < filas * 7; i++) {
        const numDia = i - offset + 1;
        if (numDia < 1 || numDia > ultimoDiaMes.getDate()) {
          celdas += `<div class="cal-celda cal-celda-vacia"></div>`;
          continue;
        }
        const fechaStr = `${mesActual.getFullYear()}-${pad(mesActual.getMonth() + 1)}-${pad(numDia)}`;
        const tieneCitas = !!(citasPorDia[fechaStr] && citasPorDia[fechaStr].length);
        const sesiones = ['cal-celda', tieneCitas ? 'cal-celda-libre' : 'cal-celda-sin-cupo'];
        if (fechaStr === diaSeleccionado) sesiones.push('cal-celda-activa');
        if (fechaStr === hoyStr) sesiones.push('cal-celda-hoy');
        celdas += `<button type="button" class="${sesiones.join(' ')}" data-fecha="${fechaStr}"${tieneCitas ? '' : ' disabled'}>${numDia}${tieneCitas ? '<span class="cal-punto"></span>' : ''}</button>`;
      }

      area.innerHTML = `
        <div class="cal-widget">
          <div class="cal-mes-col">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="ag-prev" title="Mes anterior">‹</button>
              <div class="cal-mes-titulo">${nombreMes}</div>
              <button type="button" class="cal-nav" id="ag-next" title="Mes siguiente">›</button>
            </div>
            <div class="cal-dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
            <div class="cal-celdas">${celdas}</div>
          </div>
          <div class="cal-horas-col" id="ag-detalle-wrap"></div>
        </div>
      `;

      area.querySelector('#ag-prev').addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1); render(); });
      area.querySelector('#ag-next').addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1); render(); });
      area.querySelectorAll('button[data-fecha]:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { diaSeleccionado = b.dataset.fecha; render(); });
      });

      renderDetalle();
    }

    function renderDetalle() {
      const wrap = area.querySelector('#ag-detalle-wrap');
      if (!wrap) return;
      const citas = citasPorDia[diaSeleccionado] || [];
      const fechaObj = new Date(diaSeleccionado + 'T00:00:00');
      const tituloDia = fechaObj.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'short' });
      if (!citas.length) {
        wrap.innerHTML = `<div class="cal-horas-titulo">🕐 ${tituloDia}</div><div class="empty-state">No hay sesiones ese día.</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="cal-horas-titulo">🕐 ${tituloDia}</div>
        <div class="horarios-lista">
          ${citas.map(c => `
            <div class="horario-card">
              <strong style="color:var(--texto);">${c.nombreAlumna}</strong>
              <div class="card-meta" style="margin-top:2px;">${fmtHora12(c.hora)} · ${c.horario_fijo_id != null ? 'Horario fijo' : 'Sesión puntual'}</div>
              <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
                ${c.horario_fijo_id != null ? `
                  <button class="btn-sm" type="button" id="hf-admin-reagendar-${c.id}">Reagendar</button>
                  <button class="btn-sm btn-sm-danger" type="button" id="hf-admin-cancelar-${c.id}">Cancelar esta sesión</button>
                  <span class="back-link back-link-danger" id="ag-cancelar-serie-${c.id}">Cancelar horario fijo</span>
                ` : `
                  <button class="btn-sm btn-sm-danger" type="button" id="ag-cancelar-puntual-${c.id}">Cancelar esta sesión</button>
                `}
              </div>
              <div id="hf-admin-reagendar-area-${c.id}" style="margin-top:10px;"></div>
            </div>
          `).join('')}
        </div>
      `;

      citas.forEach(c => {
        if (c.horario_fijo_id != null) {
          wireHorarioFijoBotonesAdmin({ id: c.id }, c.alumna_id, c.horario_fijo_id, c.id, () => renderAgendaCalendario());
          const btnSerie = document.getElementById(`ag-cancelar-serie-${c.id}`);
          if (btnSerie) {
            btnSerie.addEventListener('click', async () => {
              if (!confirm(`¿Cancelar el horario fijo completo de ${c.nombreAlumna}? Se cancelan sus próximas sesiones automáticas para ese horario.`)) return;
              try {
                const { data: { session } } = await supa.auth.getSession();
                const resp = await fetch('/.netlify/functions/quitar-horario-fijo', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                  body: JSON.stringify({ horarioFijoId: c.horario_fijo_id }),
                });
                const resultado = await resp.json();
                if (!resultado.ok) { alert('No se pudo quitar: ' + resultado.mensaje); return; }
                renderAgendaCalendario();
              } catch (err) {
                alert('No se pudo quitar: ' + err.message);
              }
            });
          }
        } else {
          const btnCancelarPuntual = document.getElementById(`ag-cancelar-puntual-${c.id}`);
          if (btnCancelarPuntual) {
            btnCancelarPuntual.addEventListener('click', async () => {
              if (!confirm(`¿Cancelar la sesión adicional de ${c.nombreAlumna}?`)) return;
              try {
                const { data: { session } } = await supa.auth.getSession();
                const resp = await fetch('/.netlify/functions/admin-cancelar-cita', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                  body: JSON.stringify({ citaId: c.id }),
                });
                const resultado = await resp.json();
                if (!resultado.ok) { alert('No se pudo cancelar: ' + resultado.mensaje); return; }
                renderAgendaCalendario();
              } catch (err) {
                alert('No se pudo cancelar: ' + err.message);
              }
            });
          }
        }
      });
    }

    render();
  }

  // Reutiliza el mismo calendario de horarios libres del portal para
  // reagendar desde el panel de Kathia. A diferencia del portal de la
  // alumna, aquí no hay límite de anticipación ni aviso de cobro — es
  // Kathia manejando su propia agenda.
  function construirCalendarioHorarios(area, slotsPorDia, onElegir) {
    const dias = Object.keys(slotsPorDia).sort();
    if (!dias.length) {
      area.innerHTML = `<div class="empty-state">No hay horarios libres por ahora.</div>`;
      return;
    }
    const hoyLima = new Date(Date.now() - 5 * 3600000);
    const hoyStr = hoyLima.toISOString().slice(0, 10);
    const ultimaFecha = new Date(dias[dias.length - 1] + 'T00:00:00');
    let mesActual = new Date(hoyLima.getFullYear(), hoyLima.getMonth(), 1);
    let diaSeleccionado = dias[0];
    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const primerDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const ultimoDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
      const offset = primerDiaMes.getDay();
      const filas = Math.ceil((offset + ultimoDiaMes.getDate()) / 7);
      const nombreMes = mesActual.toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });
      const puedeAnterior = mesActual.getFullYear() > hoyLima.getFullYear() ||
        (mesActual.getFullYear() === hoyLima.getFullYear() && mesActual.getMonth() > hoyLima.getMonth());
      const puedeSiguiente = mesActual.getFullYear() < ultimaFecha.getFullYear() ||
        (mesActual.getFullYear() === ultimaFecha.getFullYear() && mesActual.getMonth() < ultimaFecha.getMonth());

      let celdas = '';
      for (let i = 0; i < filas * 7; i++) {
        const numDia = i - offset + 1;
        if (numDia < 1 || numDia > ultimoDiaMes.getDate()) {
          celdas += `<div class="cal-celda cal-celda-vacia"></div>`;
          continue;
        }
        const fechaStr = `${mesActual.getFullYear()}-${pad(mesActual.getMonth() + 1)}-${pad(numDia)}`;
        const tieneSlots = !!(slotsPorDia[fechaStr] && slotsPorDia[fechaStr].length);
        const sesiones = ['cal-celda', tieneSlots ? 'cal-celda-libre' : 'cal-celda-sin-cupo'];
        if (fechaStr === diaSeleccionado) sesiones.push('cal-celda-activa');
        if (fechaStr === hoyStr) sesiones.push('cal-celda-hoy');
        celdas += `<button type="button" class="${sesiones.join(' ')}" data-fecha="${fechaStr}"${tieneSlots ? '' : ' disabled'}>${numDia}${tieneSlots ? '<span class="cal-punto"></span>' : ''}</button>`;
      }

      area.innerHTML = `
        <div class="cal-widget">
          <div class="cal-mes-col">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="cal-prev" title="Mes anterior"${puedeAnterior ? '' : ' disabled'}>‹</button>
              <div class="cal-mes-titulo">${nombreMes}</div>
              <button type="button" class="cal-nav" id="cal-next" title="Mes siguiente"${puedeSiguiente ? '' : ' disabled'}>›</button>
            </div>
            <div class="cal-dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
            <div class="cal-celdas">${celdas}</div>
          </div>
          <div class="cal-horas-col" id="cal-horas-wrap"></div>
        </div>
      `;

      const btnPrev = area.querySelector('#cal-prev');
      const btnNext = area.querySelector('#cal-next');
      if (btnPrev) btnPrev.addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1); render(); });
      if (btnNext) btnNext.addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1); render(); });
      area.querySelectorAll('button[data-fecha]:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { diaSeleccionado = b.dataset.fecha; render(); });
      });

      renderHoras();
    }

    function renderHoras() {
      const wrap = area.querySelector('#cal-horas-wrap');
      if (!wrap) return;
      const slots = slotsPorDia[diaSeleccionado] || [];
      const fechaObj = new Date(diaSeleccionado + 'T00:00:00');
      const tituloDia = fechaObj.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'short' });
      if (!slots.length) {
        wrap.innerHTML = `<div class="empty-state">No hay horarios libres ese día. Elige otro día del calendario.</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="cal-horas-titulo">🕐 ${tituloDia}</div>
        <div class="slots-grid">
          ${slots.map(s => {
            const horaTxt = new Date(s.start).toLocaleTimeString('es-PE', { hour: 'numeric', minute: '2-digit' });
            return `<button class="slot-chip" type="button" data-time="${s.start}">${horaTxt}</button>`;
          }).join('')}
        </div>
      `;
      wrap.querySelectorAll('button[data-time]').forEach(b => {
        b.addEventListener('click', () => onElegir(b, b.dataset.time));
      });
    }

    render();
  }

  function wireHorarioFijoBotonesAdmin(cita, alumnaId, horarioFijoId, idSuffix, onSuccess) {
    const suf = idSuffix != null ? idSuffix : horarioFijoId;
    const alFinalizar = onSuccess || (() => renderAgendaCalendario());
    const btnReagendar = document.getElementById(`hf-admin-reagendar-${suf}`);
    const btnCancelar = document.getElementById(`hf-admin-cancelar-${suf}`);
    const area = document.getElementById(`hf-admin-reagendar-area-${suf}`);

    if (btnReagendar) {
      btnReagendar.addEventListener('click', async () => {
        area.innerHTML = `<div class="loading">Cargando horarios libres...</div>`;
        try {
          const resp = await fetch('/.netlify/functions/horarios-disponibles?dias=30');
          const data = await resp.json();
          if (!data.ok) {
            area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios${data.mensaje ? ': ' + data.mensaje : '.'}</div>`;
            return;
          }
          construirCalendarioHorarios(area, data.slots || {}, async (b, isoTime) => {
            b.disabled = true;
            const original = b.textContent;
            b.textContent = 'Reagendando...';
            try {
              const { data: { session } } = await supa.auth.getSession();
              const resp2 = await fetch('/.netlify/functions/admin-reagendar-cita', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                body: JSON.stringify({ citaId: cita.id, nuevoInicioUTC: isoTime }),
              });
              const resultado = await resp2.json();
              if (!resultado.ok) {
                alert('No se pudo reagendar: ' + resultado.mensaje);
                b.disabled = false;
                b.textContent = original;
                return;
              }
              alFinalizar();
            } catch (err) {
              alert('No se pudo reagendar: ' + err.message);
              b.disabled = false;
              b.textContent = original;
            }
          });
        } catch (err) {
          area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios.</div>`;
        }
      });
    }

    if (btnCancelar) {
      btnCancelar.addEventListener('click', async () => {
        if (!confirm('¿Cancelar esta sesión? No se aplican restricciones ni cargos automáticos — es tu decisión.')) return;
        try {
          const { data: { session } } = await supa.auth.getSession();
          const resp = await fetch('/.netlify/functions/admin-cancelar-cita', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({ citaId: cita.id }),
          });
          const resultado = await resp.json();
          if (!resultado.ok) { alert('No se pudo cancelar: ' + resultado.mensaje); return; }
          alFinalizar();
        } catch (err) {
          alert('No se pudo cancelar: ' + err.message);
        }
      });
    }
  }

  // Vista "Agenda": todas las sesiones de todas las alumnas, en un
  // calendario de mes — se queda en el panel, sin salir a Google Calendar.
  async function renderAgendaCalendario() {
    vistaActual = 'agenda-calendario';
    contentEl.innerHTML = `
      <h1 class="greeting">Agenda</h1>
      <p class="greeting-sub">Todas las sesiones programadas de tus alumnas — de un vistazo. Haz clic en un día para ver el detalle y reagendar o cancelar.</p>
      <div id="agenda-cal-area"><div class="loading">Cargando tu agenda...</div></div>
    `;

    const hoyStr = new Date().toISOString().slice(0, 10);
    const { data: citasTodas, error } = await supa
      .from('citas_fijas')
      .select('id, fecha, hora, horario_fijo_id, alumna_id')
      .eq('estado', 'programada')
      .gte('fecha', hoyStr)
      .order('fecha', { ascending: true })
      .order('hora', { ascending: true });

    const area = document.getElementById('agenda-cal-area');
    if (error) {
      area.innerHTML = `<div class="empty-state">No se pudo cargar la agenda.</div>`;
      return;
    }

    const nombrePorAlumna = {};
    alumnasCache.forEach(a => { nombrePorAlumna[a.id] = a.nombre || a.email; });

    const citasPorDia = {};
    (citasTodas || []).forEach(c => {
      const nombreAlumna = nombrePorAlumna[c.alumna_id] || 'Alumna';
      (citasPorDia[c.fecha] = citasPorDia[c.fecha] || []).push({ ...c, nombreAlumna });
    });

    construirCalendarioAgenda(area, citasPorDia);
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = 'index.html';
  });

  init();
</script>
