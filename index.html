<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Alumnas — Kathia Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <span class="wordmark">Kathia Coach<span>Especialista en musculación · Mujeres 40+</span></span>
    <h2>Portal de Alumnas</h2>
    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" id="submit-btn">Iniciar sesión</button>
    </form>
    <div id="error" class="error-msg" style="display:none;"></div>
    <p class="help-note"><a href="olvide-password.html">¿Olvidaste tu contraseña?</a></p>
    <p class="help-note">¿Eres alumna nueva? Escríbele a Kathia por WhatsApp para recibir tu acceso.</p>
  </div>
</div>

<script>
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Si ya hay sesión activa, salta directo al portal
  supa.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'portal.html';
  });

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Ingresando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supa.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = 'Correo o contraseña incorrectos. Si no tienes cuenta todavía, escríbele a Kathia.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesión';
    } else {
      window.location.href = 'portal.html';
    }
  });
</script>

</body>
</html>
