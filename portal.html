<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Progreso — Kathia Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<nav class="top">
  <div class="wrap" id="nav-wrap">
    <span class="wordmark">Kathia Coach<span>Portal de Alumnas</span></span>
    <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
  </div>
</nav>

<main class="portal">
  <div class="wrap" id="content">
    <div class="loading">Cargando tu información...</div>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="Foto de progreso">
</div>

<script>
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const contentEl = document.getElementById('content');

  // Perfil básico de la alumna que ya inició sesión — lo llena init()
  // al cargar, y lo usan las funciones de agendar más abajo (que no
  // tienen acceso directo a la variable local `perfil` de init()) para
  // armar el mensaje de confirmación de WhatsApp.
  let miPerfilNombre = '';
  let miPerfilDireccion = null;

  // ------------------------------------------------------------
  // Confirmación de citas: como Google Calendar no manda ninguna
  // notificación por defecto (sendUpdates:'none', para no llenarle el
  // correo a Kathia ni a la alumna), la alumna no se entera de su
  // sesión por ningún canal automático a menos que active esa opción.
  // En vez de mandarle una invitación de Google (que le llenaría el
  // correo, y de todas formas no le sirve si no usa Gmail), le
  // mostramos un botón de "agregar a mi calendario" — funciona igual
  // sin importar qué correo use — más el link de WhatsApp para avisar
  // a Kathia.
  //
  // Duración de la sesión: debe coincidir con DURACION_SESION_MIN de
  // netlify/functions/_googlecalendar.js. Se repite acá porque este
  // archivo corre en el navegador, no puede importar ese módulo.
  // Confirmado por Augusto: las sesiones de Kathia duran 60 minutos.
  // ------------------------------------------------------------
  const DURACION_SESION_MIN_PORTAL = 60;

  function fechaHoraGoogleUTC(iso) {
    return new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
  }

  function linkGoogleCalendarQuickAdd({ inicioISO, direccion }) {
    const finISO = new Date(new Date(inicioISO).getTime() + DURACION_SESION_MIN_PORTAL * 60000).toISOString();
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: 'Sesión de entrenamiento con Kathia',
      dates: `${fechaHoraGoogleUTC(inicioISO)}/${fechaHoraGoogleUTC(finISO)}`,
      details: 'Sesión de entrenamiento agendada desde el portal de Kathia.',
    });
    if (direccion) params.set('location', direccion);
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }

  function descargarIcsCita({ inicioISO, direccion }) {
    const finISO = new Date(new Date(inicioISO).getTime() + DURACION_SESION_MIN_PORTAL * 60000).toISOString();
    const lineas = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kathia Coach//Portal//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${Date.now()}-${Math.floor(Math.random() * 1e6)}@kathiacoach`,
      `DTSTAMP:${fechaHoraGoogleUTC(new Date().toISOString())}`,
      `DTSTART:${fechaHoraGoogleUTC(inicioISO)}`,
      `DTEND:${fechaHoraGoogleUTC(finISO)}`,
      'SUMMARY:Sesión de entrenamiento con Kathia',
      direccion ? `LOCATION:${direccion.replace(/\r?\n/g, ' ')}` : null,
      'DESCRIPTION:Sesión agendada desde el portal de Kathia Coach.',
      'END:VEVENT', 'END:VCALENDAR',
    ].filter(Boolean).join('\r\n');
    const blob = new Blob([lineas], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sesion-kathia-coach.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  function abrirWhatsappConfirmacion({ inicioISO, direccion, tipo }) {
    const d = new Date(new Date(inicioISO).getTime() - 5 * 3600000); // hora de Lima
    const pad = (n) => String(n).padStart(2, '0');
    const fecha = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    const hora = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    const fechaFmt = fmtFecha(fecha, { conDia: true });
    const tipoTexto = tipo === 'fija' ? ' (horario fijo semanal)' : tipo === 'puntual' ? ' (sesión puntual)' : '';
    let msg = `Hola! Confirmo mi sesión de entrenamiento con Kathia el ${fechaFmt} a las ${fmtHora12(hora)}${tipoTexto}.`;
    if (direccion) msg += `\nDirección: ${direccion}`;
    const url = `https://wa.me/${KATHIA_WHATSAPP}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  // Reemplaza el contenido de `area` por un cuadro de "¡listo!" con los
  // tres botones de confirmación. Se usa justo después de agendar con
  // éxito (horario fijo o sesión puntual) — `tipo` distingue cuál de las
  // dos es, para que el mensaje de WhatsApp lo aclare.
  function mostrarConfirmacionCita(area, mensaje, { inicioISO, direccion, tipo }) {
    const urlGoogle = linkGoogleCalendarQuickAdd({ inicioISO, direccion });
    area.innerHTML = `
      <div class="empty-state" style="text-align:left;">
        <p style="margin:0 0 12px;">${mensaje}</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a class="btn-sm" href="${urlGoogle}" target="_blank" rel="noopener" style="text-decoration:none;">📅 Agregar a Google Calendar</a>
          <button class="btn-sm" type="button" data-accion="ics">⬇️ Otro calendario (.ics)</button>
          <button class="btn-sm" type="button" data-accion="whatsapp">💬 Confirmar por WhatsApp</button>
        </div>
        <span class="back-link" data-accion="cerrar" style="margin-top:14px; display:inline-block;">← Volver</span>
      </div>`;
    area.querySelector('[data-accion="ics"]').addEventListener('click', () => descargarIcsCita({ inicioISO, direccion }));
    area.querySelector('[data-accion="whatsapp"]').addEventListener('click', () => abrirWhatsappConfirmacion({ inicioISO, direccion, tipo }));
    area.querySelector('[data-accion="cerrar"]').addEventListener('click', () => init());
  }

  function fmtFecha(iso, opciones) {
    const d = new Date(iso + 'T00:00:00');
    if (opciones && opciones.conDia) {
      const texto = d.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }
    return d.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  const NOMBRES_DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  function nombreDia(n) { return NOMBRES_DIA[n] || '—'; }
  function fmtHora12(horaStr) {
    if (!horaStr) return '—';
    const [hh, mm] = horaStr.split(':').map(Number);
    const ampm = hh < 12 ? 'a.m.' : 'p.m.';
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
  }

  function mensajeAnimo(n) {
    if (n === 0) return 'Bienvenida. Muy pronto Kathia empezará a registrar aquí tu progreso, sesión a sesión.';
    if (n === 1) return 'Tu primer registro ya quedó guardado. El camino empieza así.';
    if (n <= 4) return `Llevas ${n} registros — la constancia ya está funcionando.`;
    return `Llevas ${n} registros. Este historial ya cuenta una historia real de esfuerzo.`;
  }

  // Construye un calendario de mes dentro de "area": los días con
  // horarios libres se ven resaltados y son clickeables; al elegir un
  // día se muestran sus horas abajo como chips. Se usa tanto para
  // reagendar una sesión como para elegir/cambiar el horario fijo.
  // onElegir(boton, isoInicio) se llama al hacer clic en una hora.
  function construirCalendarioHorarios(area, slotsPorDia, onElegir) {
    const dias = Object.keys(slotsPorDia).sort();
    if (!dias.length) {
      area.innerHTML = `<div class="empty-state">No hay horarios libres por ahora. <a href="https://wa.me/${KATHIA_WHATSAPP}?text=Hola%20Kathia%2C%20no%20veo%20horarios%20libres%20en%20el%20portal." target="_blank" rel="noopener">Escríbele a Kathia directamente por WhatsApp</a>.</div>`;
      return;
    }
    const hoyLima = new Date(Date.now() - 5 * 3600000);
    const hoyStr = hoyLima.toISOString().slice(0, 10);
    const ultimaFecha = new Date(dias[dias.length - 1] + 'T00:00:00');
    let mesActual = new Date(hoyLima.getFullYear(), hoyLima.getMonth(), 1);
    let diaSeleccionado = dias[0];
    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const primerDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const ultimoDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
      const offset = primerDiaMes.getDay();
      const filas = Math.ceil((offset + ultimoDiaMes.getDate()) / 7);
      const nombreMes = mesActual.toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });
      const puedeAnterior = mesActual.getFullYear() > hoyLima.getFullYear() ||
        (mesActual.getFullYear() === hoyLima.getFullYear() && mesActual.getMonth() > hoyLima.getMonth());
      const puedeSiguiente = mesActual.getFullYear() < ultimaFecha.getFullYear() ||
        (mesActual.getFullYear() === ultimaFecha.getFullYear() && mesActual.getMonth() < ultimaFecha.getMonth());

      let celdas = '';
      for (let i = 0; i < filas * 7; i++) {
        const numDia = i - offset + 1;
        if (numDia < 1 || numDia > ultimoDiaMes.getDate()) {
          celdas += `<div class="cal-celda cal-celda-vacia"></div>`;
          continue;
        }
        const fechaStr = `${mesActual.getFullYear()}-${pad(mesActual.getMonth() + 1)}-${pad(numDia)}`;
        const tieneSlots = !!(slotsPorDia[fechaStr] && slotsPorDia[fechaStr].length);
        const sesiones = ['cal-celda', tieneSlots ? 'cal-celda-libre' : 'cal-celda-sin-cupo'];
        if (fechaStr === diaSeleccionado) sesiones.push('cal-celda-activa');
        if (fechaStr === hoyStr) sesiones.push('cal-celda-hoy');
        celdas += `<button type="button" class="${sesiones.join(' ')}" data-fecha="${fechaStr}"${tieneSlots ? '' : ' disabled'}>${numDia}${tieneSlots ? '<span class="cal-punto"></span>' : ''}</button>`;
      }

      area.innerHTML = `
        <div class="cal-widget">
          <div class="cal-mes-col">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="cal-prev" title="Mes anterior"${puedeAnterior ? '' : ' disabled'}>‹</button>
              <div class="cal-mes-titulo">${nombreMes}</div>
              <button type="button" class="cal-nav" id="cal-next" title="Mes siguiente"${puedeSiguiente ? '' : ' disabled'}>›</button>
            </div>
            <div class="cal-dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
            <div class="cal-celdas">${celdas}</div>
          </div>
          <div class="cal-horas-col" id="cal-horas-wrap"></div>
        </div>
      `;

      const btnPrev = area.querySelector('#cal-prev');
      const btnNext = area.querySelector('#cal-next');
      if (btnPrev) btnPrev.addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1); render(); });
      if (btnNext) btnNext.addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1); render(); });
      area.querySelectorAll('button[data-fecha]:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { diaSeleccionado = b.dataset.fecha; render(); });
      });

      renderHoras();
    }

    function renderHoras() {
      const wrap = area.querySelector('#cal-horas-wrap');
      if (!wrap) return;
      const slots = slotsPorDia[diaSeleccionado] || [];
      const fechaObj = new Date(diaSeleccionado + 'T00:00:00');
      const tituloDia = fechaObj.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'short' });
      if (!slots.length) {
        wrap.innerHTML = `<div class="empty-state">No hay horarios libres ese día. Elige otro día del calendario.</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="cal-horas-titulo">🕐 ${tituloDia}</div>
        <div class="slots-grid">
          ${slots.map(s => {
            const horaTxt = new Date(s.start).toLocaleTimeString('es-PE', { hour: 'numeric', minute: '2-digit' });
            return `<button class="slot-chip" type="button" data-time="${s.start}">${horaTxt}</button>`;
          }).join('')}
        </div>
      `;
      wrap.querySelectorAll('button[data-time]').forEach(b => {
        b.addEventListener('click', () => onElegir(b, b.dataset.time));
      });
    }

    render();
  }

  // Calendario de solo lectura: marca los días que ya tienen alguna
  // sesión agendada (fija o puntual). Al elegir un día, muestra el
  // detalle de cada cita con sus acciones — las de horario fijo traen
  // reagendar / cancelar / cancelar todo el horario (igual que en la
  // pestaña "Agendar Sesión"); las puntuales traen reagendar (mueve
  // solo esa sesión suelta) y cancelar, ya que no pertenecen a ninguna
  // serie. citasPorDia es { 'YYYY-MM-DD': [{id, fecha, hora,
  // horario_fijo_id}, ...] }.
  function construirCalendarioMisClases(area, citasPorDia, horariosFijos) {
    const hoyLima = new Date(Date.now() - 5 * 3600000);
    const hoyStr = hoyLima.toISOString().slice(0, 10);
    let mesActual = new Date(hoyLima.getFullYear(), hoyLima.getMonth(), 1);
    let diaSeleccionado = null;
    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const primerDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const ultimoDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
      const offset = primerDiaMes.getDay();
      const filas = Math.ceil((offset + ultimoDiaMes.getDate()) / 7);
      const nombreMes = mesActual.toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });

      let celdas = '';
      for (let i = 0; i < filas * 7; i++) {
        const numDia = i - offset + 1;
        if (numDia < 1 || numDia > ultimoDiaMes.getDate()) {
          celdas += `<div class="cal-celda cal-celda-vacia"></div>`;
          continue;
        }
        const fechaStr = `${mesActual.getFullYear()}-${pad(mesActual.getMonth() + 1)}-${pad(numDia)}`;
        const tieneCitas = !!(citasPorDia[fechaStr] && citasPorDia[fechaStr].length);
        const sesiones = ['cal-celda', tieneCitas ? 'cal-celda-libre' : 'cal-celda-sin-cupo'];
        if (fechaStr === diaSeleccionado) sesiones.push('cal-celda-activa');
        if (fechaStr === hoyStr) sesiones.push('cal-celda-hoy');
        celdas += `<button type="button" class="${sesiones.join(' ')}" data-fecha="${fechaStr}"${tieneCitas ? '' : ' disabled'}>${numDia}${tieneCitas ? '<span class="cal-punto"></span>' : ''}</button>`;
      }

      area.innerHTML = `
        <div class="cal-widget">
          <div class="cal-mes-col">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="mc-prev" title="Mes anterior">‹</button>
              <div class="cal-mes-titulo">${nombreMes}</div>
              <button type="button" class="cal-nav" id="mc-next" title="Mes siguiente">›</button>
            </div>
            <div class="cal-dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
            <div class="cal-celdas">${celdas}</div>
          </div>
          <div class="cal-horas-col" id="mc-detalle-wrap"></div>
        </div>
      `;

      area.querySelector('#mc-prev').addEventListener('click', () => {
        mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1);
        diaSeleccionado = null;
        render();
      });
      area.querySelector('#mc-next').addEventListener('click', () => {
        mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1);
        diaSeleccionado = null;
        render();
      });
      area.querySelectorAll('button[data-fecha]:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { diaSeleccionado = b.dataset.fecha; render(); });
      });

      renderDetalle();
    }

    function renderDetalle() {
      const wrap = area.querySelector('#mc-detalle-wrap');
      if (!wrap) return;
      if (!diaSeleccionado) {
        wrap.innerHTML = `<div class="empty-state">Elige un día marcado para ver el detalle.</div>`;
        return;
      }
      const citas = citasPorDia[diaSeleccionado] || [];
      const fechaObj = new Date(diaSeleccionado + 'T00:00:00');
      const tituloDia = fechaObj.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'short' });
      wrap.innerHTML = `
        <div class="cal-horas-titulo">🕐 ${tituloDia}</div>
        ${citas.map(c => `
          <div class="horario-card" style="padding:12px 14px; margin-bottom:8px;">
            <div class="horario-card-titulo" style="font-size:13.5px;">${fmtHora12(c.hora)} — ${c.horario_fijo_id != null ? 'Horario fijo' : 'Sesión adicional'}</div>
            ${c.horario_fijo_id != null ? `
              <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">
                <button class="btn-sm" type="button" id="mc-reagendar-${c.id}" title="Cambiar tu horario fijo a otro día u hora libre (hasta 1 día antes)">↻ Reagendar</button>
                <button class="btn-sm btn-sm-danger" type="button" id="mc-cancelar-emergencia-${c.id}" title="Cancelar esta sesión">✕ Cancelar sesión</button>
              </div>
              <div id="mc-reagendar-area-${c.id}" style="margin-top:8px;"></div>
              <div style="margin-top:10px;">
                <span class="back-link back-link-danger" id="mc-cancelar-serie-${c.id}" style="font-size:12.5px;" title="Deja de tener esta sesión fija cada semana">🛑 Cancelar este horario fijo</span>
                <div id="mc-cancelar-serie-area-${c.id}" style="margin-top:8px;"></div>
              </div>
            ` : `
              <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">
                <button class="btn-sm" type="button" id="mc-reagendar-puntual-${c.id}" title="Cambiar esta sesión a otro día u hora libre (hasta 1 día antes)">↻ Reagendar</button>
                <button class="btn-sm btn-sm-danger" type="button" data-cancelar-cita="${c.id}">✕ Cancelar sesión</button>
              </div>
              <div id="mc-reagendar-puntual-area-${c.id}" style="margin-top:8px;"></div>
            `}
          </div>
        `).join('')}
      `;

      // Sesiones puntuales: cancelar.
      wrap.querySelectorAll('[data-cancelar-cita]').forEach(el => {
        el.addEventListener('click', async () => {
          if (!confirm('¿Cancelar esta sesión?')) return;
          try {
            const { data: { session } } = await supa.auth.getSession();
            const resp = await fetch('/.netlify/functions/cancelar-cita', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
              body: JSON.stringify({ citaId: Number(el.dataset.cancelarCita) }),
            });
            const resultado = await resp.json();
            if (!resultado.ok) { alert('No se pudo cancelar: ' + resultado.mensaje); return; }
            init();
          } catch (err) {
            alert('No se pudo cancelar: ' + err.message);
          }
        });
      });

      // Sesiones puntuales: también se pueden reagendar (mueve solo esa
      // sesión suelta a otro día/hora libre, sin tocar ningún horario fijo).
      citas.filter(c => c.horario_fijo_id == null).forEach(c => {
        const btnReagendarPuntual = wrap.querySelector(`#mc-reagendar-puntual-${c.id}`);
        if (!btnReagendarPuntual) return;
        btnReagendarPuntual.addEventListener('click', async () => {
          const inicio = new Date(`${c.fecha}T${c.hora}:00.000-05:00`);
          const horasFaltantes = (inicio.getTime() - Date.now()) / 3600000;
          const areaReagendar = wrap.querySelector(`#mc-reagendar-puntual-area-${c.id}`);
          if (horasFaltantes < 24) {
            areaReagendar.innerHTML = `<div class="empty-state">Ya no se puede reagendar: falta menos de 1 día para tu sesión. <a href="https://wa.me/${KATHIA_WHATSAPP}?text=Hola%20Kathia%2C%20necesito%20reagendar%20mi%20sesión." target="_blank" rel="noopener">Escríbele a Kathia por WhatsApp</a>.</div>`;
            return;
          }
          areaReagendar.innerHTML = `<div class="loading">Cargando horarios libres...</div>`;
          try {
            const resp = await fetch('/.netlify/functions/horarios-disponibles?dias=30');
            const data = await resp.json();
            if (!data.ok) {
              areaReagendar.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios${data.mensaje ? ': ' + data.mensaje : '.'}</div>`;
              return;
            }
            construirCalendarioHorarios(areaReagendar, data.slots || {}, async (b, isoTime) => {
              if (!confirm('¿Cambiar esta sesión a ese nuevo horario?')) return;
              b.disabled = true;
              const original = b.textContent;
              b.textContent = 'Cambiando...';
              try {
                const { data: { session } } = await supa.auth.getSession();
                const resp2 = await fetch('/.netlify/functions/reagendar-cita', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                  body: JSON.stringify({ citaId: c.id, nuevoInicioUTC: isoTime }),
                });
                const resultado = await resp2.json();
                if (!resultado.ok) { alert('No se pudo reagendar: ' + resultado.mensaje); b.disabled = false; b.textContent = original; return; }
                alert('¡Listo! Tu sesión quedó reagendada.');
                init();
              } catch (err) {
                alert('No se pudo reagendar: ' + err.message);
                b.disabled = false; b.textContent = original;
              }
            });
          } catch (err) {
            areaReagendar.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios: ${err.message}</div>`;
          }
        });
      });

      // Sesiones de horario fijo: reagendar (cambia el horario fijo desde
      // esa fecha en adelante), cancelar (solo esta) o cancelar todo el
      // horario fijo (la serie completa).
      citas.filter(c => c.horario_fijo_id != null).forEach(c => {
        const h = horariosFijos.find(x => x.id === c.horario_fijo_id);
        if (!h) return;

        function horasFaltantes() {
          const inicio = new Date(`${c.fecha}T${c.hora}:00.000-05:00`);
          return (inicio.getTime() - Date.now()) / 3600000;
        }

        const btnReagendar = wrap.querySelector(`#mc-reagendar-${c.id}`);
        if (btnReagendar) {
          btnReagendar.addEventListener('click', () => {
            if (horasFaltantes() < 24) {
              wrap.querySelector(`#mc-reagendar-area-${c.id}`).innerHTML = `<div class="empty-state">Ya no se puede reagendar: falta menos de 1 día para tu sesión. <a href="https://wa.me/${KATHIA_WHATSAPP}?text=Hola%20Kathia%2C%20necesito%20reagendar%20mi%20sesión." target="_blank" rel="noopener">Escríbele a Kathia por WhatsApp</a>.</div>`;
              return;
            }
            cargarSelectorHorarios(`mc-reagendar-area-${c.id}`, { reemplazar: true, horarioFijoId: h.id });
          });
        }

        const btnCancelarEmergencia = wrap.querySelector(`#mc-cancelar-emergencia-${c.id}`);
        if (btnCancelarEmergencia) {
          btnCancelarEmergencia.addEventListener('click', async () => {
            if (!confirm('¿Cancelar esta sesión?')) return;
            try {
              const { data: { session } } = await supa.auth.getSession();
              const resp = await fetch('/.netlify/functions/cancelar-cita', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                body: JSON.stringify({ citaId: c.id }),
              });
              const resultado = await resp.json();
              if (!resultado.ok) { alert('No se pudo cancelar: ' + resultado.mensaje); return; }
              alert('Tu sesión quedó cancelada.');
              init();
            } catch (err) {
              alert('No se pudo cancelar: ' + err.message);
            }
          });
        }

        const btnCancelarSerie = wrap.querySelector(`#mc-cancelar-serie-${c.id}`);
        if (btnCancelarSerie) {
          btnCancelarSerie.addEventListener('click', async () => {
            const aviso = `¿Seguro que quieres cancelar tu horario de ${nombreDia(h.dia_semana)} a las ${fmtHora12(h.hora)}?\n\nSe cancelan tus próximas sesiones automáticas en ese horario. Si más adelante quieres retomarlo, puedes elegir un horario nuevo desde aquí mismo.`;
            if (!confirm(aviso)) return;
            const areaSerie = wrap.querySelector(`#mc-cancelar-serie-area-${c.id}`);
            areaSerie.innerHTML = `<div class="loading">Cancelando este horario...</div>`;
            try {
              const { data: { session } } = await supa.auth.getSession();
              const resp = await fetch('/.netlify/functions/quitar-horario-fijo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                body: JSON.stringify({ horarioFijoId: h.id }),
              });
              const resultado = await resp.json();
              if (!resultado.ok) {
                areaSerie.innerHTML = `<div class="empty-state">No se pudo cancelar: ${resultado.mensaje}</div>`;
                return;
              }
              init();
            } catch (err) {
              areaSerie.innerHTML = `<div class="empty-state">No se pudo cancelar: ${err.message}</div>`;
            }
          });
        }
      });
    }

    render();
  }

  // Carga el selector de horarios libres para agendar una sesión suelta
  // ("puntual"): no crea horario fijo, solo una cita individual además
  // de lo que ya tenga agendado.
  async function cargarSelectorClasePuntual(areaId) {
    const area = document.getElementById(areaId);
    if (!area) return;
    area.innerHTML = `<div class="loading">Cargando horarios libres...</div>`;
    try {
      const resp = await fetch('/.netlify/functions/horarios-disponibles?dias=30');
      const data = await resp.json();
      if (!data.ok) {
        area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios${data.mensaje ? ': ' + data.mensaje : '.'}</div>`;
        return;
      }
      construirCalendarioHorarios(area, data.slots || {}, async (b, isoTime) => {
        const { diaSemana, hora } = limaDiaHora(isoTime);
        if (!confirm(`¿Agendar una sesión adicional el ${nombreDia(diaSemana)} a las ${fmtHora12(hora)}? Es una sesión suelta — no cambia tu horario fijo.`)) return;
        b.disabled = true;
        const original = b.textContent;
        b.textContent = 'Agendando...';
        try {
          const { data: { session } } = await supa.auth.getSession();
          const resp2 = await fetch('/.netlify/functions/agendar-clase-puntual', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({ inicioISO: isoTime }),
          });
          const resultado = await resp2.json();
          if (!resultado.ok) {
            alert('No se pudo agendar: ' + resultado.mensaje);
            b.disabled = false;
            b.textContent = original;
            return;
          }
          mostrarConfirmacionCita(area, '¡Listo! Tu sesión adicional quedó agendada.', { inicioISO: isoTime, direccion: miPerfilDireccion, tipo: 'puntual' });
        } catch (err) {
          alert('No se pudo agendar: ' + err.message);
          b.disabled = false;
          b.textContent = original;
        }
      });
    } catch (err) {
      area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios.</div>`;
    }
  }

  // Cuando la alumna TODAVÍA no tiene ningún horario fijo, primero elige
  // entre horario fijo semanal o sesión puntual, y solo se carga/muestra
  // ese — así no se puede confundir uno con otro sin querer.
  function wireTipoSesionChooser() {
    const btnFijo = document.getElementById('btn-tipo-fijo');
    const btnPuntual = document.getElementById('btn-tipo-puntual');
    const contenido = document.getElementById('tipo-sesion-contenido');
    if (!btnFijo || !btnPuntual || !contenido) return;

    function marcarActivo(btnActivo) {
      [btnFijo, btnPuntual].forEach(b => {
        const activo = b === btnActivo;
        b.style.background = activo ? 'var(--acento)' : '';
        b.style.color = activo ? '#fff' : '';
        b.style.borderColor = activo ? 'var(--acento)' : '';
      });
    }

    function mostrarFijo() {
      marcarActivo(btnFijo);
      contenido.innerHTML = `
        <p class="panel-sub">Elige uno de los horarios que Kathia tiene libres — quedará como tu sesión fija de cada semana, de forma indefinida. No tienes que volver a agendar mes a mes: el sistema te va agregando fechas nuevas automáticamente.</p>
        <div id="elegir-horario-area"><div class="loading">Cargando horarios libres...</div></div>
      `;
      cargarSelectorHorarios('elegir-horario-area');
    }

    function mostrarPuntual() {
      marcarActivo(btnPuntual);
      contenido.innerHTML = `
        <p class="panel-sub">Agenda una sola sesión suelta, sin comprometerte a un horario fijo cada semana.</p>
        <div id="agendar-puntual-area"><div class="loading">Cargando horarios libres...</div></div>
      `;
      cargarSelectorClasePuntual('agendar-puntual-area');
    }

    btnFijo.addEventListener('click', mostrarFijo);
    btnPuntual.addEventListener('click', mostrarPuntual);

    // Los botones "Agendar horario fijo"/"Agendar sesión puntual" del
    // dashboard de Inicio (cuando la alumna todavía no tiene ninguna
    // sesión) llevan directo a la opción elegida, sin obligarla a
    // volver a elegir acá.
    window.__mostrarTipoFijo = mostrarFijo;
    window.__mostrarTipoPuntual = mostrarPuntual;
  }

  // Conecta el botón "Agendar una sesión adicional (puntual)" — se usa
  // solo dentro del calendario de horario fijo (cuando la alumna YA
  // tiene uno), para agregar una sesión suelta además del horario fijo.
  function wireAgendarPuntual() {
    const btn = document.getElementById('btn-agendar-puntual');
    const area = document.getElementById('agendar-puntual-area');
    if (!btn || !area) return;
    btn.addEventListener('click', () => {
      const oculto = area.style.display === 'none';
      area.style.display = oculto ? '' : 'none';
      if (oculto && area.dataset.cargado !== 'true') {
        area.dataset.cargado = 'true';
        cargarSelectorClasePuntual('agendar-puntual-area');
      }
    });
  }

  // Calendario mensual del horario fijo: marca los días que ya tienen
  // una sesión fija agendada. Al elegir un día, muestra esa sesión con
  // sus 3 acciones — reagendar (cambia el horario fijo desde ahí en
  // adelante), cancelar (solo esa sesión) o cancelar todo el horario
  // fijo (la serie completa). citasFijasPorDia es
  // { 'YYYY-MM-DD': [{id, fecha, hora, horario_fijo_id}] }.
  function construirCalendarioHorarioFijo(area, citasFijasPorDia, horariosFijos) {
    const hoyLima = new Date(Date.now() - 5 * 3600000);
    const hoyStr = hoyLima.toISOString().slice(0, 10);
    let mesActual = new Date(hoyLima.getFullYear(), hoyLima.getMonth(), 1);
    let diaSeleccionado = null;
    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const primerDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const ultimoDiaMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
      const offset = primerDiaMes.getDay();
      const filas = Math.ceil((offset + ultimoDiaMes.getDate()) / 7);
      const nombreMes = mesActual.toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });

      let celdas = '';
      for (let i = 0; i < filas * 7; i++) {
        const numDia = i - offset + 1;
        if (numDia < 1 || numDia > ultimoDiaMes.getDate()) {
          celdas += `<div class="cal-celda cal-celda-vacia"></div>`;
          continue;
        }
        const fechaStr = `${mesActual.getFullYear()}-${pad(mesActual.getMonth() + 1)}-${pad(numDia)}`;
        const tieneCita = !!(citasFijasPorDia[fechaStr] && citasFijasPorDia[fechaStr].length);
        const sesiones = ['cal-celda', tieneCita ? 'cal-celda-libre' : 'cal-celda-sin-cupo'];
        if (fechaStr === diaSeleccionado) sesiones.push('cal-celda-activa');
        if (fechaStr === hoyStr) sesiones.push('cal-celda-hoy');
        celdas += `<button type="button" class="${sesiones.join(' ')}" data-fecha="${fechaStr}"${tieneCita ? '' : ' disabled'}>${numDia}${tieneCita ? '<span class="cal-punto"></span>' : ''}</button>`;
      }

      area.innerHTML = `
        <div class="cal-widget">
          <div class="cal-mes-col">
            <div class="cal-header">
              <button type="button" class="cal-nav" id="hf-prev" title="Mes anterior">‹</button>
              <div class="cal-mes-titulo">${nombreMes}</div>
              <button type="button" class="cal-nav" id="hf-next" title="Mes siguiente">›</button>
            </div>
            <div class="cal-dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
            <div class="cal-celdas">${celdas}</div>
          </div>
          <div class="cal-horas-col">
            <div id="hf-detalle-wrap"></div>
            <div id="hf-acciones-extra" style="margin-top:18px; padding-top:14px; border-top:1px solid var(--linea);">
              <span class="back-link" id="btn-agregar-horario" title="Elegir otro día y hora, además de los que ya tienes">➕ Agregar otro horario fijo</span>
              <div id="agregar-horario-area" style="margin-top:12px; display:none;"></div>
              <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--linea);">
                <span class="back-link" id="btn-agendar-puntual" title="Agendar una sesión suelta, además de tu horario fijo">➕ Agendar una sesión adicional (puntual)</span>
                <div id="agendar-puntual-area" style="margin-top:12px; display:none;"></div>
              </div>
            </div>
          </div>
        </div>
      `;

      area.querySelector('#hf-prev').addEventListener('click', () => {
        mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1);
        diaSeleccionado = null;
        render();
      });
      area.querySelector('#hf-next').addEventListener('click', () => {
        mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1);
        diaSeleccionado = null;
        render();
      });
      area.querySelectorAll('button[data-fecha]:not(:disabled)').forEach(b => {
        b.addEventListener('click', () => { diaSeleccionado = b.dataset.fecha; render(); });
      });

      renderDetalle();
      // El calendario se reconstruye entero en cada render() (mes u hora
      // seleccionada), así que hay que reconectar estos dos botones cada vez.
      wireAgregarHorario();
      wireAgendarPuntual();
    }

    function renderDetalle() {
      const wrap = area.querySelector('#hf-detalle-wrap');
      if (!wrap) return;
      if (!diaSeleccionado) {
        wrap.innerHTML = `<div class="empty-state">Elige un día marcado para reagendar o cancelar esa sesión.</div>`;
        return;
      }
      const cita = (citasFijasPorDia[diaSeleccionado] || [])[0];
      const h = cita && horariosFijos.find(x => x.id === cita.horario_fijo_id);
      if (!cita || !h) {
        wrap.innerHTML = `<div class="empty-state">No se encontró esa sesión.</div>`;
        return;
      }
      const fechaObj = new Date(diaSeleccionado + 'T00:00:00');
      const tituloDia = fechaObj.toLocaleDateString('es-PE', { weekday: 'long', day: '2-digit', month: 'short' });
      wrap.innerHTML = `
        <div class="cal-horas-titulo">🕐 ${tituloDia}</div>
        <div class="horario-card-titulo" style="margin-bottom:10px;">${nombreDia(h.dia_semana)} a las ${fmtHora12(h.hora)}, cada semana</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn-sm" type="button" id="hf-reagendar" title="Cambiar tu horario fijo a otro día u hora libre (hasta 1 día antes)">↻ Reagendar</button>
          <button class="btn-sm btn-sm-danger" type="button" id="hf-cancelar-emergencia" title="Cancelar esta sesión">✕ Cancelar sesión</button>
        </div>
        <div id="hf-reagendar-area" style="margin-top:10px;"></div>
        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--linea);">
          <span class="back-link back-link-danger" id="hf-cancelar-serie" title="Deja de tener esta sesión fija cada semana">🛑 Cancelar este horario fijo</span>
          <div id="hf-cancelar-serie-area" style="margin-top:10px;"></div>
        </div>
      `;

      function horasFaltantes() {
        const inicio = new Date(`${cita.fecha}T${cita.hora}:00.000-05:00`);
        return (inicio.getTime() - Date.now()) / 3600000;
      }

      wrap.querySelector('#hf-reagendar').addEventListener('click', () => {
        if (horasFaltantes() < 24) {
          wrap.querySelector('#hf-reagendar-area').innerHTML = `<div class="empty-state">Ya no se puede reagendar: falta menos de 1 día para tu sesión. <a href="https://wa.me/${KATHIA_WHATSAPP}?text=Hola%20Kathia%2C%20necesito%20reagendar%20mi%20sesión." target="_blank" rel="noopener">Escríbele a Kathia por WhatsApp</a>.</div>`;
          return;
        }
        cargarSelectorHorarios('hf-reagendar-area', { reemplazar: true, horarioFijoId: h.id });
      });

      wrap.querySelector('#hf-cancelar-emergencia').addEventListener('click', async () => {
        if (!confirm('¿Cancelar esta sesión?')) return;
        try {
          const { data: { session } } = await supa.auth.getSession();
          const resp = await fetch('/.netlify/functions/cancelar-cita', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({ citaId: cita.id }),
          });
          const resultado = await resp.json();
          if (!resultado.ok) { alert('No se pudo cancelar: ' + resultado.mensaje); return; }
          alert('Tu sesión quedó cancelada.');
          init();
        } catch (err) {
          alert('No se pudo cancelar: ' + err.message);
        }
      });

      wrap.querySelector('#hf-cancelar-serie').addEventListener('click', async () => {
        const aviso = `¿Seguro que quieres cancelar tu horario de ${nombreDia(h.dia_semana)} a las ${fmtHora12(h.hora)}?\n\nSe cancelan tus próximas sesiones automáticas en ese horario. Si más adelante quieres retomarlo, puedes elegir un horario nuevo desde aquí mismo.`;
        if (!confirm(aviso)) return;
        const areaSerie = wrap.querySelector('#hf-cancelar-serie-area');
        areaSerie.innerHTML = `<div class="loading">Cancelando este horario...</div>`;
        try {
          const { data: { session } } = await supa.auth.getSession();
          const resp = await fetch('/.netlify/functions/quitar-horario-fijo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({ horarioFijoId: h.id }),
          });
          const resultado = await resp.json();
          if (!resultado.ok) {
            areaSerie.innerHTML = `<div class="empty-state">No se pudo cancelar: ${resultado.mensaje}</div>`;
            return;
          }
          init();
        } catch (err) {
          areaSerie.innerHTML = `<div class="empty-state">No se pudo cancelar: ${err.message}</div>`;
        }
      });
    }

    render();
  }

  // Convierte un horario libre (ISO en UTC, como los que devuelve
  // horarios-disponibles.js) al día de la semana + hora de pared en Lima,
  // que es lo que necesita asignar-horario-fijo para crear la serie.
  function limaDiaHora(isoStr) {
    const d = new Date(isoStr);
    const limaMs = d.getTime() - 5 * 3600000;
    const ld = new Date(limaMs);
    const pad = (n) => String(n).padStart(2, '0');
    return { diaSemana: ld.getUTCDay(), hora: `${pad(ld.getUTCHours())}:${pad(ld.getUTCMinutes())}` };
  }

  // Carga los horarios libres de Kathia en el contenedor indicado, para
  // que la alumna elija uno como horario fijo. Se usa tanto para agregar
  // uno nuevo (el primero, o uno más además de los que ya tiene) como,
  // con opciones.reemplazar = true + opciones.horarioFijoId, para
  // cambiar un horario que ya existe.
  async function cargarSelectorHorarios(areaId, opciones) {
    opciones = opciones || {};
    const area = document.getElementById(areaId);
    if (!area) return;
    area.innerHTML = `<div class="loading">Cargando horarios libres...</div>`;
    try {
      const resp = await fetch('/.netlify/functions/horarios-disponibles?dias=30');
      const data = await resp.json();
      if (!data.ok) {
        area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios${data.mensaje ? ': ' + data.mensaje : '.'}</div>`;
        return;
      }
      construirCalendarioHorarios(area, data.slots || {}, async (b, isoTime) => {
        const { diaSemana, hora } = limaDiaHora(isoTime);
        const mensajeConfirm = opciones.reemplazar
          ? `¿Cambiar ese horario fijo a ${nombreDia(diaSemana)} a las ${fmtHora12(hora)}?`
          : `¿Agregar ${nombreDia(diaSemana)} a las ${fmtHora12(hora)} como uno de tus horarios fijos de cada semana?`;
        if (!confirm(mensajeConfirm)) return;
        b.disabled = true;
        const original = b.textContent;
        b.textContent = opciones.reemplazar ? 'Cambiando...' : 'Creando tu horario...';
        try {
          const { data: { session } } = await supa.auth.getSession();
          // Mandamos también la fecha exacta que la alumna eligió en el
          // calendario (no solo el día de la semana), para que la primera
          // sesión se cree ahí y no en la próxima ocurrencia de ese día
          // desde hoy (que puede ser una fecha distinta, más cercana).
          const payload = { diaSemana, hora, inicioISO: isoTime };
          if (opciones.reemplazar) {
            payload.reemplazar = true;
            payload.horarioFijoId = opciones.horarioFijoId;
          }
          const resp2 = await fetch('/.netlify/functions/asignar-horario-fijo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify(payload),
          });
          const resultado = await resp2.json();
          if (!resultado.ok) {
            alert('No se pudo guardar tu horario: ' + resultado.mensaje);
            b.disabled = false;
            b.textContent = original;
            return;
          }
          const mensajeExito = opciones.reemplazar ? '¡Listo! Ese horario quedó actualizado.' : '¡Listo! Ese quedó como uno de tus horarios fijos de cada semana.';
          mostrarConfirmacionCita(area, mensajeExito, { inicioISO: isoTime, direccion: miPerfilDireccion, tipo: 'fija' });
        } catch (err) {
          alert('No se pudo guardar tu horario: ' + err.message);
          b.disabled = false;
          b.textContent = original;
        }
      });
    } catch (err) {
      area.innerHTML = `<div class="empty-state">No se pudieron cargar los horarios.</div>`;
    }
  }

  // Conecta los botones del recordatorio suave ("Todo sigue igual" /
  // "Cambiar") de UN horario fijo puntual — puede haber uno de estos
  // recordatorios por cada horario activo, así que va con sufijo -${horarioFijoId}.
  function wireRecordatorioHorario(horarioFijoId) {
    const btnConfirmar = document.getElementById(`btn-confirmar-horario-${horarioFijoId}`);
    const btnCambiar = document.getElementById(`btn-cambiar-horario-${horarioFijoId}`);
    const areaId = `cambiar-horario-area-${horarioFijoId}`;
    const area = document.getElementById(areaId);

    if (btnConfirmar) {
      btnConfirmar.addEventListener('click', async () => {
        const selectIntervalo = document.getElementById(`recordatorio-intervalo-${horarioFijoId}`);
        const intervaloDias = selectIntervalo ? parseInt(selectIntervalo.value, 10) : 30;
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = 'Confirmando...';
        try {
          const { data: { session } } = await supa.auth.getSession();
          const resp = await fetch('/.netlify/functions/confirmar-horario-fijo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
            body: JSON.stringify({ horarioFijoId, intervaloDias }),
          });
          const resultado = await resp.json();
          if (!resultado.ok) {
            alert('No se pudo confirmar: ' + resultado.mensaje);
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = 'Todo sigue igual';
            return;
          }
          init();
        } catch (err) {
          alert('No se pudo confirmar: ' + err.message);
          btnConfirmar.disabled = false;
          btnConfirmar.textContent = 'Todo sigue igual';
        }
      });
    }

    if (btnCambiar && area) {
      btnCambiar.addEventListener('click', () => {
        const oculto = area.style.display === 'none';
        area.style.display = oculto ? '' : 'none';
        if (oculto && area.dataset.cargado !== 'true') {
          area.dataset.cargado = 'true';
          cargarSelectorHorarios(areaId, { reemplazar: true, horarioFijoId });
        }
      });
    }
  }

  // Conecta el botón "Agregar otro horario fijo" (o "Elige tu primer
  // horario fijo" si todavía no tiene ninguno).
  function wireAgregarHorario() {
    const btn = document.getElementById('btn-agregar-horario');
    const area = document.getElementById('agregar-horario-area');
    if (!btn || !area) return;
    btn.addEventListener('click', () => {
      const oculto = area.style.display === 'none';
      area.style.display = oculto ? '' : 'none';
      if (oculto && area.dataset.cargado !== 'true') {
        area.dataset.cargado = 'true';
        cargarSelectorHorarios('agregar-horario-area', {});
      }
    });
  }

  async function init() {
    const { data: { session } } = await supa.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    const user = session.user;

    // Perfil de la alumna (nombre + si es admin + meta de peso + dirección
    // + preferencia de correos de Google Calendar).
    const { data: perfil } = await supa
      .from('alumnas')
      .select('nombre, es_admin, peso_objetivo, direccion, recibir_invites_calendario')
      .eq('id', user.id)
      .single();

    // Las administradoras no ven este portal — van directo a su propio panel.
    if (perfil && perfil.es_admin) { window.location.href = 'admin.html'; return; }

    miPerfilNombre = (perfil && perfil.nombre) ? perfil.nombre : user.email;
    miPerfilDireccion = perfil && perfil.direccion || null;

    const nombre = (perfil && perfil.nombre) ? perfil.nombre : user.email;

    // ¿Ya tiene horario(s) fijo(s)? Una alumna puede tener más de uno a
    // la vez (por ejemplo lunes y viernes) — en vez del calendario
    // abierto le mostramos la lista con sus opciones de reagendar/
    // cancelar cada una. Si no tiene ninguno todavía, sigue agendando
    // libremente como siempre.
    const { data: horarios } = await supa
      .from('horario_fijo')
      .select('id, dia_semana, hora, proxima_confirmacion, recordatorio_intervalo_dias')
      .eq('alumna_id', user.id)
      .eq('activo', true)
      .order('dia_semana', { ascending: true })
      .order('hora', { ascending: true });
    const horariosFijos = horarios || [];

    const hoyStr = new Date().toISOString().slice(0, 10);
    const hoyLima = new Date(Date.now() - 5 * 3600000).toISOString().slice(0, 10);

    // Todas sus citas programadas —de horario fijo Y sesiones adicionales
    // sueltas ("puntuales")— en una sola consulta. De acá sale tanto la
    // próxima cita de cada horario como el calendario de "tus sesiones
    // este mes" y la tarjeta resumen de arriba.
    const { data: misCitasData } = await supa
      .from('citas_fijas')
      .select('id, fecha, hora, horario_fijo_id')
      .eq('alumna_id', user.id)
      .eq('estado', 'programada')
      .gte('fecha', hoyStr)
      .order('fecha', { ascending: true })
      .order('hora', { ascending: true });
    const todasMisCitas = misCitasData || [];

    for (const h of horariosFijos) {
      h.mostrarRecordatorio = false;
      if (h.proxima_confirmacion && h.recordatorio_intervalo_dias > 0) {
        const diffDias = (new Date(h.proxima_confirmacion) - new Date(hoyLima)) / 86400000;
        h.mostrarRecordatorio = diffDias <= 7;
      }
    }

    // La próxima cita entre TODAS sus citas (horario fijo o puntuales),
    // para el resumen de arriba — ya viene ordenada por fecha/hora.
    const proximaCitaGeneral = todasMisCitas[0] || null;
    const hayRecordatorioPendiente = horariosFijos.some(h => h.mostrarRecordatorio);

    // Agrupadas por día, para el calendario de "tus sesiones este mes"
    // (landing, todas) y el calendario del horario fijo (solo esas).
    const citasPorDia = {};
    const citasFijasPorDia = {};
    todasMisCitas.forEach(c => {
      (citasPorDia[c.fecha] = citasPorDia[c.fecha] || []).push(c);
      if (c.horario_fijo_id != null) {
        (citasFijasPorDia[c.fecha] = citasFijasPorDia[c.fecha] || []).push(c);
      }
    });
    const proximaCitaFijaGeneral = todasMisCitas.find(c => c.horario_fijo_id != null) || null;

    // Su progreso (peso, cintura, cadera), más reciente primero.
    const { data: progreso, error: progresoError } = await supa
      .from('progreso')
      .select('fecha, peso_kg, cintura_cm, cadera_cm, medidas, notas, foto_path, animo')
      .eq('alumna_id', user.id)
      .order('fecha', { ascending: false });

    const total = progreso ? progreso.length : 0;

    let progresoHTML;
    let chartsHTML = '';
    let metaHTML = '';
    let charts = [];

    if (progresoError) {
      progresoHTML = `<div class="empty-state">No se pudo cargar tu progreso. Intenta recargar la página.</div>`;
    } else if (!progreso || progreso.length === 0) {
      progresoHTML = `<div class="empty-state">Todavía no hay registros. Kathia irá agregando tus mediciones después de cada evaluación.</div>`;
    } else {
      progresoHTML = `<div class="timeline">` + progreso.map(p => {
        const chips = [];
        if (p.peso_kg != null) chips.push(`<span class="chip">⚖️ ${p.peso_kg} kg</span>`);
        if (p.cintura_cm != null) chips.push(`<span class="chip">📏 Cintura ${p.cintura_cm} cm</span>`);
        if (p.cadera_cm != null) chips.push(`<span class="chip">📏 Cadera ${p.cadera_cm} cm</span>`);
        const nota = p.notas || p.medidas;
        return `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-card">
              <div class="timeline-fecha">${fmtFecha(p.fecha)}${p.animo ? `<span class="animo-icon" title="Mensaje de ánimo de Kathia">${p.animo}</span>` : ''}</div>
              ${chips.length ? `<div class="chip-row">${chips.join('')}</div>` : ''}
              ${nota ? `<p class="timeline-nota">${nota}</p>` : ''}
              ${p.foto_path ? `<span class="foto-link" data-path="${p.foto_path}">📷 Ver foto →</span>` : ''}
            </div>
          </div>
        `;
      }).join('') + `</div>`;

      // Gráficos — uno por métrica, solo si hay 2+ datos
      const cronologico = [...progreso].reverse();
      const metricas = [
        { id: 'peso-chart', label: 'Peso', unidad: 'kg', key: 'peso_kg', icon: '⚖️' },
        { id: 'cintura-chart', label: 'Cintura', unidad: 'cm', key: 'cintura_cm', icon: '📏' },
        { id: 'cadera-chart', label: 'Cadera', unidad: 'cm', key: 'cadera_cm', icon: '📏' },
      ];
      metricas.forEach(m => {
        const serie = cronologico.filter(p => p[m.key] != null);
        if (serie.length >= 2) charts.push({ ...m, serie });
      });

      let statCardsHTML = '';
      if (charts.length) {
        statCardsHTML = charts.map(c => {
          const inicial = c.serie[0][c.key];
          const actual = c.serie[c.serie.length - 1][c.key];
          const delta = actual - inicial;
          const flecha = delta > 0 ? '↑' : (delta < 0 ? '↓' : '→');
          return `
            <div class="stat-card">
              <div class="stat-icon">${c.icon}</div>
              <div class="stat-label">${c.label}</div>
              <div class="stat-values">${inicial} → <strong>${actual}</strong> ${c.unidad}</div>
              <div class="stat-delta">${flecha} ${Math.abs(delta).toFixed(1)} ${c.unidad}</div>
            </div>
          `;
        }).join('');
      }

      if (charts.length) {
        chartsHTML = `<div class="charts-grid">` + charts.map(c =>
          `<div class="chart-card"><canvas id="${c.id}" height="150"></canvas></div>`
        ).join('') + `</div>`;
      }

      // Meta de peso — anillo de avance si hay al menos 2 registros de peso, si no, texto simple
      const seriePeso = cronologico.filter(p => p.peso_kg != null);
      if (perfil && perfil.peso_objetivo != null && seriePeso.length >= 1) {
        const ultimoPeso = seriePeso[seriePeso.length - 1].peso_kg;
        const inicialPeso = seriePeso[0].peso_kg;
        const diff = Math.abs(ultimoPeso - perfil.peso_objetivo);
        const alcanzada = diff < 0.5;

        if (seriePeso.length >= 2 && inicialPeso !== perfil.peso_objetivo) {
          let pct = ((ultimoPeso - inicialPeso) / (perfil.peso_objetivo - inicialPeso)) * 100;
          pct = Math.max(0, Math.min(100, Math.round(pct)));
          metaHTML = `
            <div class="meta-ring-card">
              <div class="ring-wrap">
                <canvas id="meta-ring" width="130" height="130"></canvas>
                <div class="ring-center"><div class="ring-pct">${pct}%</div></div>
              </div>
              <div class="ring-caption">
                ${alcanzada
                  ? `🎉 ¡Llegaste a tu meta de <strong>${perfil.peso_objetivo} kg</strong>!`
                  : `Vas al <strong>${pct}%</strong> de tu meta de <strong>${perfil.peso_objetivo} kg</strong>.`}
              </div>
            </div>
          `;
        } else {
          metaHTML = alcanzada
            ? `<div class="meta-box">🎯 ¡Llegaste a tu meta de <strong>${perfil.peso_objetivo} kg</strong>!</div>`
            : `<div class="meta-box">🎯 Te faltan <strong>${diff.toFixed(1)} kg</strong> para tu meta de <strong>${perfil.peso_objetivo} kg</strong>.</div>`;
        }
      }

      if (statCardsHTML) {
        chartsHTML = `<div class="stat-cards">${statCardsHTML}</div>` + chartsHTML;
      }
    }

    // Último registro — para la tarjeta resumen de progreso.
    const ultimoRegistro = (progreso && progreso.length) ? progreso[0] : null;

    // Cuántas de sus citas (fijas o puntuales) caen este mes — para la
    // tercera tarjeta resumen.
    const hoyDateObj = new Date();
    const mesActualStr = `${hoyDateObj.getFullYear()}-${String(hoyDateObj.getMonth() + 1).padStart(2, '0')}`;
    const clasesEsteMes = todasMisCitas.filter(c => c.fecha.slice(0, 7) === mesActualStr).length;

    // Tarjetas resumen del landing: de un vistazo, sin entrar a ninguna
    // pestaña, la alumna ve cuándo es su próxima sesión, su último
    // registro y cuántas sesiones le quedan este mes. Cada una lleva a
    // la pestaña correspondiente si quiere ver el detalle completo.
    const resumenHTML = `
      <div class="resumen-cards">
        <div class="resumen-card resumen-card--destacada" id="resumen-proxima" role="button" tabindex="0" title="Ver o agendar tu sesión">
          <div class="resumen-icon">🗓️</div>
          <div class="resumen-label">Próxima sesión</div>
          <div class="resumen-valor">${proximaCitaGeneral
            ? `${fmtFecha(proximaCitaGeneral.fecha, { conDia: true })}<br>${fmtHora12(proximaCitaGeneral.hora)}`
            : 'Aún no tienes una sesión fija agendada'}</div>
        </div>
        <div class="resumen-card" id="resumen-progreso" role="button" tabindex="0" title="Ver tu progreso completo">
          <div class="resumen-icon">📊</div>
          <div class="resumen-label">Tu progreso</div>
          <div class="resumen-valor">${ultimoRegistro ? fmtFecha(ultimoRegistro.fecha) : 'Sin registros aún'}</div>
          ${ultimoRegistro && ultimoRegistro.peso_kg != null ? `
            <div class="resumen-detalle">
              <div>⚖️ ${ultimoRegistro.peso_kg} kg</div>
            </div>
          ` : ''}
        </div>
        <div class="resumen-card" id="resumen-sesiones-mes" role="button" tabindex="0" title="Ver tus sesiones del mes">
          <div class="resumen-icon">📆</div>
          <div class="resumen-label">Sesiones restantes este mes</div>
          <div class="resumen-valor">${clasesEsteMes}</div>
        </div>
      </div>
    `;

    // El calendario de "tus sesiones este mes" vive en el dashboard de
    // inicio — pero solo tiene sentido mostrarlo si ya hay algo agendado.
    // Si no, invita a agendar en su lugar.
    const misClasesMesHTML = todasMisCitas.length ? `
      <h3 style="margin-bottom:4px;">🗓️ Tus sesiones este mes</h3>
      <p class="panel-sub">Todas tus sesiones programadas — las de tu horario fijo y las adicionales.</p>
      <div id="mis-citas-calendario"><div class="loading">Cargando tus sesiones...</div></div>
    ` : `
      <div class="cta-agendar">
        <p>Aún no tienes ninguna sesión agendada.</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
          <button type="button" id="btn-cta-agendar-fijo" class="btn-sm" style="background:var(--acento); color:#fff; border-color:var(--acento);" title="Un mismo día y hora cada semana, de forma indefinida">📅 Agendar horario fijo</button>
          <button type="button" id="btn-cta-agendar-puntual" class="btn-sm" title="Una sola sesión suelta, sin comprometerte a un horario semanal">➕ Agendar sesión puntual</button>
        </div>
      </div>
    `;

    contentEl.innerHTML = `
      <h1 class="greeting">Hola, ${nombre.split(' ')[0]}</h1>
      <p class="greeting-sub" style="font-family:'Playfair Display', serif; font-style:italic; font-size:17px; color:var(--texto);">
        “${mensajeAnimo(total)}”
      </p>

      <div class="portal-tabs" role="tablist">
        <button type="button" class="portal-tab active" id="tab-inicio" role="tab" aria-selected="true" title="Tu resumen y calendario">🏠 Inicio</button>
        <button type="button" class="portal-tab" id="tab-progreso" role="tab" aria-selected="false" title="Ver tu peso, medidas y avance a lo largo del tiempo">📊 Mi progreso</button>
        <button type="button" class="portal-tab" id="tab-horario" role="tab" aria-selected="false" title="Agendar una sesión, ver tu horario fijo, reagendar o cancelar">📅 Agendar Sesión${(!horariosFijos.length || hayRecordatorioPendiente) ? '<span class="tab-dot" title="Necesita tu atención"></span>' : ''}</button>
      </div>

      <section class="block panel-tab" id="panel-inicio">
        <div class="dashboard-row">
          <div class="dashboard-indicadores">
            ${resumenHTML}
          </div>
          <div class="dashboard-calendario">
            ${misClasesMesHTML}
          </div>
        </div>

        <div style="margin-top:22px; padding-top:16px; border-top:1px solid var(--linea);">
          <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-size:13.5px; color:var(--texto-suave);">
            <input type="checkbox" id="chk-recibir-invites" style="width:auto; margin-top:2px;"${perfil && perfil.recibir_invites_calendario ? ' checked' : ''}>
            <span>Recibir también un correo automático de Google Calendar por cada sesión (invitación, cambio de horario o cancelación). Sin marcar esto, solo te avisamos por WhatsApp y desde acá.</span>
          </label>
        </div>
      </section>

      <section class="block panel-tab" id="panel-progreso" style="display:none;">
        <h3>📊 Tu progreso</h3>
        <p class="panel-sub">Así ha ido cada una de tus sesiones con Kathia.</p>
        ${metaHTML}
        ${chartsHTML}
        ${progresoHTML}
      </section>

      <section class="block panel-tab" id="panel-horario" style="display:none;">
        ${horariosFijos.length ? `
          <h3>📅 Tu horario fijo</h3>
          <p class="panel-sub">${horariosFijos.length === 1 ? '1 sesión fija por semana.' : horariosFijos.length + ' sesiones fijas por semana.'}</p>

          ${horariosFijos.filter(h => h.mostrarRecordatorio).map(h => `
            <div class="meta-box" style="margin-bottom:14px;">
              <div>🔔 Tu horario de <strong>${nombreDia(h.dia_semana)} a las ${fmtHora12(h.hora)}</strong> sigue activo. ¿Todo bien o prefieres cambiarlo?</div>
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:12px;">
                <label style="font-size:13px; color:var(--texto-suave); display:flex; align-items:center; gap:6px;">
                  Avísame:
                  <select id="recordatorio-intervalo-${h.id}" style="width:auto;" title="Con qué frecuencia quieres que te preguntemos esto">
                    <option value="30"${(h.recordatorio_intervalo_dias || 30) === 30 ? ' selected' : ''}>Cada mes</option>
                    <option value="60"${h.recordatorio_intervalo_dias === 60 ? ' selected' : ''}>Cada 2 meses</option>
                    <option value="90"${h.recordatorio_intervalo_dias === 90 ? ' selected' : ''}>Cada 3 meses</option>
                    <option value="0"${h.recordatorio_intervalo_dias === 0 ? ' selected' : ''}>Nunca, no preguntarme más</option>
                  </select>
                </label>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <button class="btn-sm" type="button" id="btn-confirmar-horario-${h.id}" title="Dejar este horario tal como está">Todo sigue igual</button>
                  <span class="back-link" id="btn-cambiar-horario-${h.id}" title="Elegir un día u hora distinto entre lo disponible">Cambiar</span>
                </div>
              </div>
            </div>
            <div id="cambiar-horario-area-${h.id}" style="margin-bottom:14px; display:none;"></div>
          `).join('')}

          ${proximaCitaFijaGeneral ? `<div class="semana-proxima">🗓️ <strong>Tu próxima sesión fija es:</strong>&nbsp;${fmtFecha(proximaCitaFijaGeneral.fecha, { conDia: true })} · ${fmtHora12(proximaCitaFijaGeneral.hora)}</div>` : ''}

          <div id="calendario-horario-fijo" style="margin-top:16px;"><div class="loading">Cargando tu calendario...</div></div>
        ` : `
          <h3>📅 Agendar Sesión</h3>
          <p class="panel-sub">Primero elige qué tipo de sesión quieres agendar — son dos cosas distintas, así que solo se muestra una a la vez.</p>
          <div class="tipo-sesion-chooser" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
            <button type="button" id="btn-tipo-fijo" class="btn-sm" title="Un mismo día y hora cada semana, de forma indefinida">📅 Horario fijo semanal</button>
            <button type="button" id="btn-tipo-puntual" class="btn-sm" title="Una sola sesión suelta, sin comprometerte a un horario semanal">➕ Sesión puntual</button>
          </div>
          <div id="tipo-sesion-contenido"></div>
        `}
      </section>
    `;

    const tabInicio = document.getElementById('tab-inicio');
    const tabProgreso = document.getElementById('tab-progreso');
    const tabHorario = document.getElementById('tab-horario');
    const panelInicio = document.getElementById('panel-inicio');
    const panelProgreso = document.getElementById('panel-progreso');
    const panelHorario = document.getElementById('panel-horario');
    function activarTabPortal(cual) {
      tabInicio.classList.toggle('active', cual === 'inicio');
      tabProgreso.classList.toggle('active', cual === 'progreso');
      tabHorario.classList.toggle('active', cual === 'horario');
      tabInicio.setAttribute('aria-selected', String(cual === 'inicio'));
      tabProgreso.setAttribute('aria-selected', String(cual === 'progreso'));
      tabHorario.setAttribute('aria-selected', String(cual === 'horario'));
      panelInicio.style.display = cual === 'inicio' ? '' : 'none';
      panelProgreso.style.display = cual === 'progreso' ? '' : 'none';
      panelHorario.style.display = cual === 'horario' ? '' : 'none';
    }
    tabInicio.addEventListener('click', () => activarTabPortal('inicio'));
    tabProgreso.addEventListener('click', () => activarTabPortal('progreso'));
    tabHorario.addEventListener('click', () => activarTabPortal('horario'));

    // Las tarjetas resumen del landing también llevan a su pestaña —
    // click o Enter/Espacio (son role="button").
    [['resumen-proxima', 'horario'], ['resumen-progreso', 'progreso'], ['resumen-sesiones-mes', 'horario']].forEach(([id, tab]) => {
      const card = document.getElementById(id);
      if (!card) return;
      card.addEventListener('click', () => activarTabPortal(tab));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activarTabPortal(tab); }
      });
    });

    // Preferencia de recibir el correo automático de Google Calendar.
    const chkRecibirInvites = document.getElementById('chk-recibir-invites');
    if (chkRecibirInvites) {
      chkRecibirInvites.addEventListener('change', async () => {
        const valor = chkRecibirInvites.checked;
        chkRecibirInvites.disabled = true;
        const { error } = await supa.from('alumnas').update({ recibir_invites_calendario: valor }).eq('id', user.id);
        chkRecibirInvites.disabled = false;
        if (error) {
          chkRecibirInvites.checked = !valor;
          alert('No se pudo guardar tu preferencia: ' + error.message);
        }
      });
    }

    // El calendario de "tus sesiones este mes" solo existe en el DOM si ya
    // hay algo agendado; si no, lo que hay es el botón de invitación.
    if (todasMisCitas.length) {
      construirCalendarioMisClases(document.getElementById('mis-citas-calendario'), citasPorDia, horariosFijos);
    } else {
      const btnCtaFijo = document.getElementById('btn-cta-agendar-fijo');
      if (btnCtaFijo) btnCtaFijo.addEventListener('click', () => {
        activarTabPortal('horario');
        if (window.__mostrarTipoFijo) window.__mostrarTipoFijo();
      });
      const btnCtaPuntual = document.getElementById('btn-cta-agendar-puntual');
      if (btnCtaPuntual) btnCtaPuntual.addEventListener('click', () => {
        activarTabPortal('horario');
        if (window.__mostrarTipoPuntual) window.__mostrarTipoPuntual();
      });
    }

    // Cuando hay horario fijo, "Agregar otro horario" y "Agendar sesión
    // puntual" viven dentro del widget de calendario (construirCalendarioHorarioFijo
    // los conecta él mismo, porque se reconstruyen cada vez que cambia el
    // mes o el día seleccionado). Cuando todavía no hay horario fijo, hay
    // que mostrar primero el elector de tipo de sesión.
    if (horariosFijos.length) {
      construirCalendarioHorarioFijo(document.getElementById('calendario-horario-fijo'), citasFijasPorDia, horariosFijos);
      horariosFijos.forEach(h => {
        if (h.mostrarRecordatorio) wireRecordatorioHorario(h.id);
      });
    } else {
      wireTipoSesionChooser();
    }

    // Gráficos de línea (evolución en el tiempo) — hay que crearlos
    // después de que el HTML de arriba ya esté en el DOM.
    charts.forEach(c => {
      new Chart(document.getElementById(c.id), {
        type: 'line',
        data: {
          labels: c.serie.map(p => fmtFecha(p.fecha)),
          datasets: [{
            label: c.label,
            data: c.serie.map(p => p[c.key]),
            borderColor: '#B5714A',
            backgroundColor: 'rgba(181,113,74,0.08)',
            tension: 0.3,
            fill: true,
            pointBackgroundColor: '#B5714A',
          }]
        },
        options: {
          plugins: {
            legend: { display: false },
            title: { display: true, text: `${c.label} (${c.unidad})`, font: { family: 'Inter', size: 12.5, weight: '500' }, color: '#7A756B', padding: { bottom: 10 } }
          },
          scales: { y: { grid: { color: '#E5DFD3' } }, x: { grid: { display: false } } }
        }
      });
    });

    const ringEl = document.getElementById('meta-ring');
    if (ringEl) {
      const pct = parseInt(document.querySelector('.ring-pct').textContent, 10) || 0;
      new Chart(ringEl, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [pct, 100 - pct],
            backgroundColor: ['#B5714A', '#E5DFD3'],
            borderWidth: 0,
          }]
        },
        options: {
          cutout: '75%',
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          animation: { duration: 700 },
        }
      });
    }

    document.querySelectorAll('.foto-link').forEach(el => {
      el.addEventListener('click', async () => {
        const original = el.textContent;
        el.textContent = 'Cargando...';
        const { data, error } = await supa.storage.from('progreso-fotos').createSignedUrl(el.dataset.path, 3600);
        el.textContent = original;
        if (!error && data) {
          document.getElementById('lightbox-img').src = data.signedUrl;
          document.getElementById('lightbox').classList.add('open');
        }
      });
    });
  }

  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = 'index.html';
  });

  init();
</script>

</body>
</html>
